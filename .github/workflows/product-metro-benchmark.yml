name: Product Expo transform cache action replay
on:
  push:
    branches: [benchmark/ci-product-metro-20261121]
permissions:
  contents: read
env:
  CI: "1"
  E2E_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"
  EXPO_NO_TELEMETRY: "1"
  EXPO_NO_DOTENV: "1"
  DISPOSABL_MOBILE_CHANNEL: metro-benchmark
  BUN_VERSION: "1.4.5"
  NODE_VERSION: "24"
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.5" }
      - run: bun install --frozen-lockfile --filter @disposabl/mobile
      - name: Select Android update fixture
        id: fingerprint
        run: echo 'build=false' >> "$GITHUB_OUTPUT"
      - name: Restore Expo transform cache
        id: metro-cache
        if: steps.fingerprint.outputs.build == 'false' && !(github.event_name == 'push' && github.repository == 'disposabl-dev/create-disposabl-app')
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/expo-metro-restore
          key: expo-metro-v1-${{ github.job == 'android' && 'android' || 'ios' }}-${{ runner.os }}-${{ runner.arch }}-${{ env.NODE_VERSION }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'package.json', 'apps/mobile/package.json', 'apps/mobile/*config.*', 'patches/**') }}
      - name: Set Expo transform cache paths
        if: steps.metro-cache.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/expo-metro-restore" "$RUNNER_TEMP/expo-metro-output"
          printf 'EXPO_METRO_CACHE_RESTORE_DIR=%s\nEXPO_METRO_CACHE_OUTPUT_DIR=%s\n' \
            "$RUNNER_TEMP/expo-metro-restore" "$RUNNER_TEMP/expo-metro-output" >> "$GITHUB_ENV"
      - name: Export as in the Android update job
        id: ota
        working-directory: apps/mobile
        env:
          CACHE_HIT: ${{ steps.metro-cache.outputs.cache-hit }}
        run: |
          if [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]; then test "$CACHE_HIT" != true; else test "$CACHE_HIT" = true; fi
          export EXPO_PUBLIC_CONVEX_URL="https://metro-attempt-${GITHUB_RUN_ATTEMPT}.invalid"
          export EXPO_PUBLIC_CONVEX_SITE_URL="$EXPO_PUBLIC_CONVEX_URL"
          /usr/bin/time -p bun x --no-install expo export --platform android --output-dir "$RUNNER_TEMP/meta-ota"
          target=$(jq -er '.fileMetadata.android.bundle' "$RUNNER_TEMP/meta-ota/metadata.json")
          grep -aFq "$EXPO_PUBLIC_CONVEX_URL" "$RUNNER_TEMP/meta-ota/$target"
          if [[ "$GITHUB_RUN_ATTEMPT" != 1 ]] && grep -aFq 'https://metro-attempt-1.invalid' "$RUNNER_TEMP/meta-ota/$target"; then exit 1; fi
      - name: Save current Expo transforms on a cache miss
        if: steps.ota.outcome == 'success' && steps.metro-cache.outcome == 'success' && steps.metro-cache.outputs.cache-hit != 'true'
        run: |
          if [[ -n "$(find "$EXPO_METRO_CACHE_OUTPUT_DIR" -type f -print -quit)" ]] &&
            rmdir "$EXPO_METRO_CACHE_RESTORE_DIR"; then
            mv "$EXPO_METRO_CACHE_OUTPUT_DIR" "$EXPO_METRO_CACHE_RESTORE_DIR"
          fi
