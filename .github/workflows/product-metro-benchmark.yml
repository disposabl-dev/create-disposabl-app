name: Product Metro native bundle cache benchmark
on:
  push:
    branches: [benchmark/ci-product-metro-20261121]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_DOTENV: "1"
      E2E_TELEMETRY_DISABLED: "1"
      UPDATE_POLICY: disabled
      DISPOSABL_MOBILE_CHANNEL: metro-benchmark
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.5" }
      - run: bun install --frozen-lockfile --filter @disposabl/mobile
      - name: Measure cold and restored Android release bundles
        working-directory: apps/mobile
        run: |
          entry=$(node -p 'require.resolve(require("./package.json").main)')
          work="$RUNNER_TEMP/metro-proof"
          mkdir -p "$work/build" "$work/fresh"
          bundle() {
            local stage="$1" restore="$2" origin="$3"
            rm -rf -- "$work/build/assets"
            mkdir -p "$work/build/assets" "$work/$stage-cache"
            EXPO_METRO_CACHE_RESTORE_DIR="$work/$restore" EXPO_METRO_CACHE_OUTPUT_DIR="$work/$stage-cache" \
              EXPO_PUBLIC_CONVEX_URL="$origin" EXPO_PUBLIC_CONVEX_SITE_URL="$origin" \
              /usr/bin/time -f "$stage Metro: %e s" bun x --no-install expo export:embed \
                --platform android --dev false --reset-cache --entry-file "$entry" \
                --bundle-output "$work/build/index.android.bundle" --assets-dest "$work/build/assets" \
                --sourcemap-output "$work/build/index.android.bundle.map" --minify false
            test -s "$work/build/index.android.bundle"
            grep -Fq "$origin" "$work/build/index.android.bundle"
            (
              cd "$work/build"
              find assets index.android.bundle -type f -print0 | sort -z | xargs -0 sha256sum
            ) > "$work/$stage.sha256"
            du -sh "$work/$stage-cache"
            test -n "$(find "$work/$stage-cache" -type f -print -quit)"
          }
          bundle cold fresh https://metro-a.invalid
          bundle warm cold-cache https://metro-a.invalid
          diff -u "$work/cold.sha256" "$work/warm.sha256"
          bundle updated cold-cache https://metro-b.invalid
          if grep -Fq 'https://metro-a.invalid' "$work/build/index.android.bundle"; then
            echo 'Restoring Metro transforms retained the previous app origin.' >&2
            exit 1
          fi
          bundle updated-cold fresh https://metro-b.invalid
          diff -u "$work/updated-cold.sha256" "$work/updated.sha256"
