name: Product Metro OTA export cache benchmark
on:
  push:
    branches: [benchmark/ci-product-metro-20261121]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        platform: [android, ios]
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_DOTENV: "1"
      E2E_TELEMETRY_DISABLED: "1"
      DISPOSABL_MOBILE_CHANNEL: metro-benchmark
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with: { ref: "${{ github.sha }}", persist-credentials: false }
      - uses: actions/setup-node@v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.5" }
      - run: bun install --frozen-lockfile --filter @disposabl/mobile
      - name: Compare actual Expo OTA export using fresh and restored transforms
        working-directory: apps/mobile
        run: |
          work="$RUNNER_TEMP/metro-ota"
          hermes="$(node -p 'require("node:path").dirname(require.resolve("hermes-compiler/package.json"))')/hermesc/linux64-bin/hermesc"
          test -x "$hermes"
          mkdir -p "$work/fresh"
          bundle() {
            local stage="$1" restore="$2" origin="$3"
            mkdir -p "$work/$stage-tmp" "$work/$stage-cache"
            TMPDIR="$work/$stage-tmp" EXPO_METRO_CACHE_RESTORE_DIR="$work/$restore" \
              EXPO_METRO_CACHE_OUTPUT_DIR="$work/$stage-cache" \
              EXPO_PUBLIC_CONVEX_URL="$origin" EXPO_PUBLIC_CONVEX_SITE_URL="$origin" \
              /usr/bin/time -f "$stage Metro OTA: %e s" bun x --no-install expo export \
                --platform "$PLATFORM" --output-dir "$work/$stage"
            test -n "$(find "$work/$stage-cache" -type f -print -quit)"
            (
              cd "$work/$stage"
              jq -e --arg platform "$PLATFORM" '.fileMetadata[$platform].bundle | type == "string" and length > 0' metadata.json >/dev/null
              embedded=$(jq -r --arg platform "$PLATFORM" '.fileMetadata[$platform].bundle' metadata.json)
              test -s "$embedded"
              grep -aF -q "$origin" "$embedded"
              if [[ "$origin" != https://metro-a.invalid ]] && grep -aF -q 'https://metro-a.invalid' "$embedded"; then
                exit 1
              fi
              # Hermes embeds Expo's randomly generated compiler input path.
              # Compare all bytecode instructions and only normalize that debug path.
              "$hermes" -dump-bytecode "$embedded" | LC_ALL=C sed -E \
                's#[/[:alnum:]._-]+/expo-bundler-[0-9.]+-[0-9]+/index\.js#<expo-bundler>/index.js#g' | sha256sum
              find . -type f ! -name '*.hbc' -print0 | sort -z | xargs -0 sha256sum
            ) > "$work/$stage.sha256"
            du -sh "$work/$stage-cache"
          }
          bundle cold fresh https://metro-a.invalid
          bundle warm cold-cache https://metro-a.invalid
          diff -u "$work/cold.sha256" "$work/warm.sha256"
          bundle updated cold-cache https://metro-b.invalid
          bundle updated-cold fresh https://metro-b.invalid
          diff -u "$work/updated-cold.sha256" "$work/updated.sha256"
