name: Product unit recovery benchmark
on:
  push:
    branches: [benchmark/cli-recovery-parallel]

permissions:
  contents: read

jobs:
  unit:
    name: Product unit / ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, candidate]
    env:
      CI: "1"
      GH_TOKEN: ""
      E2E_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      VARIANT: ${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select and verify the sole source difference
        run: |
          set -euo pipefail
          file=packages/tests/cli-release-recovery.test.ts
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e 48630a83^{commit}
          if [[ "$VARIANT" == baseline ]]; then
            git show "48630a83:$file" > "$file"
            test "$(git diff --name-only)" = "$file"
            test "$(git hash-object "$file")" = "$(git rev-parse "48630a83:$file")"
          else
            test -z "$(git status --porcelain)"
            test "$(git hash-object "$file")" = "$(git rev-parse "HEAD:$file")"
          fi
          printf 'commit=%s\nvariant=%s\nfile=' "$GITHUB_SHA" "$VARIANT"
          git hash-object "$file"
      - uses: actions/setup-node@v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.5" }
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/create-disposabl-app build
      - name: Run full product unit suite
        working-directory: packages/tests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/unit-result"
          /usr/bin/time -p bun test --parallel=4 --bail=1 --reporter=junit \
            --reporter-outfile="$RUNNER_TEMP/unit-result/junit.xml" *.test.ts
          test -s "$RUNNER_TEMP/unit-result/junit.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-unit-${{ matrix.variant }}
          path: ${{ runner.temp }}/unit-result/
          retention-days: 1
          if-no-files-found: error

  compare:
    name: Compare test identities and outcomes
    needs: unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: product-unit-*
          path: results
      - name: Compare complete JUnit results
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def results(variant):
              root = ET.parse(Path('results') / f'product-unit-{variant}' / 'junit.xml')
              cases = Counter()
              for case in root.iter('testcase'):
                  outcome = ('failure' if case.find('failure') is not None or case.find('error') is not None
                             else 'skipped' if case.find('skipped') is not None else 'passed')
                  cases[(case.get('classname'), case.get('name'), outcome)] += 1
              if not cases:
                  raise RuntimeError(f'{variant} contains no test cases')
              print(variant, 'total', sum(cases.values()), 'outcomes', dict(Counter({outcome: sum(n for (_, _, state), n in cases.items() if state == outcome) for outcome in ('passed', 'skipped', 'failure')})))
              return cases

          baseline, candidate = results('baseline'), results('candidate')
          missing, added = baseline - candidate, candidate - baseline
          if missing or added:
              raise RuntimeError(f'JUnit differs: missing={list(missing.items())}, added={list(added.items())}')
          print('All test identities and outcomes match.')
          PY
