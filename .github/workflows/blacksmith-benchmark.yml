name: Blacksmith benchmark
on:
  push:
    branches: [benchmark/blacksmith-20261101]
  workflow_dispatch:
defaults:
  run:
    working-directory: benchmark-app
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: web, runner: blacksmith-4vcpu-ubuntu-2404}
          - {name: linux, runner: blacksmith-2vcpu-ubuntu-2404}
          - {name: windows, runner: blacksmith-2vcpu-windows-2025}
          - {name: macos, runner: blacksmith-6vcpu-macos-26}
          - {name: android, runner: blacksmith-4vcpu-ubuntu-2404}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      VITE_CONVEX_URL: https://ci.invalid
      VITE_CONVEX_SITE_URL: https://ci.invalid
      EXPO_PROJECT_ID: 74446a59-bd68-4e6b-823f-618c688178fe
      EXPO_OWNER: vivek-yast
      EXPO_SLUG: disposabl-starter-android
      DISPOSABL_ANDROID_CHANNEL: ci-benchmark-blacksmith
      DISPOSABL_RELEASE_VERSION: 1.0.42
      DISPOSABL_DESKTOP_PLATFORM: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: 1.4.4}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: benchmark-clean-20261101b-bun-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('benchmark-app/bun.lock') }}
      - uses: actions/cache@v4
        if: contains(fromJSON('["linux", "windows", "macos"]'), matrix.name)
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: benchmark-clean-20261101b-electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('benchmark-app/bun.lock') }}
      - uses: actions/setup-java@v4
        if: matrix.name == 'android'
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.name == 'android'
        with: {cache-read-only: false}
      - name: Runner information
        shell: bash
        run: |
          uname -a
          node -e 'console.log(JSON.stringify(require("os").cpus()))'
          if [[ "$RUNNER_OS" == macOS ]]; then xcodebuild -version; fi
      - name: Linux packaging dependencies
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm
      - name: Install
        run: bun install --frozen-lockfile
      - name: Web build
        if: matrix.name == 'web'
        run: bun run lint && bun run typecheck && bun run build --filter=!desktop
      - name: Desktop build
        if: contains(fromJSON('["linux", "windows", "macos"]'), matrix.name)
        run: bun run --cwd apps/desktop preview
      - name: Android build
        if: matrix.name == 'android'
        run: bun run --cwd apps/mobile build:android
