name: Isolated browser worker benchmark
on:
  push:
    branches: [benchmark/ci-browser-workers-20261121]

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'disposabl-dev/create-disposabl-app'
    name: Browser / ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PRODUCT_BROWSER_SHARD: ${{ matrix.shard }}
      GH_TOKEN: ""
      PYTHONDONTWRITEBYTECODE: 1
      DO_NOT_TRACK: 1
      E2E_TELEMETRY_DISABLED: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact source in isolation
        uses: ./.github/actions/product-checks
        with:
          source_sha: ${{ github.sha }}
          lane: browser
