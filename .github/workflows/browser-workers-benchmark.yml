name: Isolated browser worker benchmark
on:
  push:
    branches: [benchmark/ci-browser-workers-20261121]

permissions:
  contents: read

jobs:
  compare:
    if: github.repository == 'disposabl-dev/create-disposabl-app'
    name: Browser / ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [full, 1/2, 2/2]
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PRODUCT_BROWSER_SHARD: ${{ matrix.shard }}
      GH_TOKEN: ""
      PYTHONDONTWRITEBYTECODE: 1
      DO_NOT_TRACK: 1
      E2E_TELEMETRY_DISABLED: 1
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate exact source in isolation
        uses: ./.github/actions/product-checks
        with:
          source_sha: ${{ github.sha }}
          lane: browser
  isolation:
    if: github.repository == 'disposabl-dev/create-disposabl-app'
    name: Blacksmith network isolation
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Check namespace and loopback
        run: |
          sudo unshare --net --fork /bin/bash -euxc '
            ip link set lo up
            links=$(ip -o link show | cut -d: -f2)
            printf "Namespace interface names: %s\n" "$links"
            test "$(ip -o link show | wc -l)" -eq 1
            ip -o link show | grep -Eq "^[0-9]+: lo:"
            runuser -u "$1" -- id -u
          ' _ "$(id -un)"
