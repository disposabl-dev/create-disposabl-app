name: Desktop Linux runtime benchmark
on:
  push:
    branches: [benchmark/ci-desktop-linux-runtime-20261121]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    if: github.repository == 'disposabl-dev/create-disposabl-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DISPOSABL_RELEASE_VERSION: 1.0.0
      DISPOSABL_DESKTOP_PLATFORM: linux
      DPKG_DEB_COMPRESSOR_LEVEL: "1"
      electron_config_cache: ${{ github.workspace }}/.cache/electron
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install desktop dependencies
        run: time bun install --frozen-lockfile --filter ./apps/desktop
      - name: Install Linux packaging and runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm cpio xvfb xauth imagemagick tesseract-ocr
      - name: Package real desktop app
        run: time bun run --cwd apps/desktop preview
      - name: Verify artifacts and launch packaged DEB
        run: time bash .github/scripts/desktop-linux-runtime-benchmark.sh
      - name: Upload runtime screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-runtime-evidence
          path: desktop-linux-runtime.png
          if-no-files-found: warn
          retention-days: 1
