name: Qualify packaged Windows install and update UI
on:
  push:
    branches: [benchmark/windows-squirrel-visible-20261121]
permissions:
  contents: read
jobs:
  update:
    if: github.repository == 'disposabl-dev/create-disposabl-app'
    name: Local update / ${{ matrix.signing }}
    runs-on: windows-2025
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        signing: [unsigned, fixture-signed]
    env:
      DISPOSABL_DESKTOP_PLATFORM: windows
      DISPOSABL_DESKTOP_UPDATE_URL: https://ci.invalid/desktop/updates/00000000000000000000000000000001
      SQUIRREL_CAPTURE_WINDOWS: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5
          persist-credentials: false
      - name: Verify immutable product source
        shell: bash
        run: |
          git merge-base --is-ancestor 48630a83685f3fcfbe9086ec2b9b8b3c6e3858a2 HEAD
          git diff --exit-code 48630a83685f3fcfbe9086ec2b9b8b3c6e3858a2 HEAD -- . ':(exclude).github/workflows/benchmark-squirrel-zip.yml' ':(exclude).github/workflows/benchmark-squirrel-update.yml' ':(exclude).github/benchmarks/squirrel-*'
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install frozen desktop dependencies
        shell: bash
        run: time bun install --frozen-lockfile --filter ./apps/desktop
      - name: Create temporary fixture-only signing identity
        if: matrix.signing == 'fixture-signed'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Squirrel CI fixture only' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyExportPolicy Exportable
          "SQUIRREL_TEST_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          $pfx = Join-Path $env:RUNNER_TEMP 'squirrel-fixture.pfx'
          $password = ConvertTo-SecureString 'fixture-only-password' -AsPlainText -Force
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          "SQUIRREL_TEST_PFX=$pfx" >> $env:GITHUB_ENV
      - name: Build version 1 with default ZIP compression
        shell: bash
        run: |
          mkdir -p ../sqtmp
          export TMP="$(cygpath -aw ../sqtmp)" TEMP="$(cygpath -aw ../sqtmp)" TMPDIR="$(cygpath -aw ../sqtmp)"
          export DISPOSABL_RELEASE_VERSION=1.42.1
          export NODE_OPTIONS="--require \"$(cygpath -am .github/benchmarks/squirrel-preload.cjs)\""
          { time bun run --cwd apps/desktop preview; } 2>&1 | tee "$(cygpath -u "$RUNNER_TEMP")/squirrel-v1-build.log"
          python .github/benchmarks/squirrel-manifest.py
          cp "$(cygpath -u "$RUNNER_TEMP")/squirrel-manifest.json" "$(cygpath -u "$RUNNER_TEMP")/squirrel-v1-manifest.json"
      - name: Install and launch version 1
        shell: pwsh
        timeout-minutes: 4
        run: .github/benchmarks/squirrel-update-install.ps1
      - name: Build version 2 with default ZIP compression
        shell: bash
        run: |
          export TMP="$(cygpath -aw ../sqtmp)" TEMP="$(cygpath -aw ../sqtmp)" TMPDIR="$(cygpath -aw ../sqtmp)"
          export DISPOSABL_RELEASE_VERSION=1.42.2
          export NODE_OPTIONS="--require \"$(cygpath -am .github/benchmarks/squirrel-preload.cjs)\""
          { time bun run --cwd apps/desktop preview; } 2>&1 | tee "$(cygpath -u "$RUNNER_TEMP")/squirrel-v2-build.log"
          python .github/benchmarks/squirrel-manifest.py
          cp "$(cygpath -u "$RUNNER_TEMP")/squirrel-manifest.json" "$(cygpath -u "$RUNNER_TEMP")/squirrel-v2-manifest.json"
      - name: Apply package through localhost Squirrel feed and verify the window
        shell: pwsh
        timeout-minutes: 5
        run: .github/benchmarks/squirrel-update-apply.ps1
      - name: Clean up fixture installation and identity
        if: always()
        shell: pwsh
        run: .github/benchmarks/squirrel-update-cleanup.ps1
      - name: Upload fixture evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: squirrel-update-${{ matrix.signing }}
          path: |
            ${{ runner.temp }}/squirrel-v1-build.log
            ${{ runner.temp }}/squirrel-v2-build.log
            ${{ runner.temp }}/squirrel-v1-manifest.json
            ${{ runner.temp }}/squirrel-v2-manifest.json
            ${{ runner.temp }}/squirrel-update-feed.log
            ${{ runner.temp }}/squirrel-update-result.txt
            ${{ runner.temp }}/squirrel-window-*.png
            ${{ runner.temp }}/squirrel-window-*.json
          if-no-files-found: ignore
          retention-days: 1
