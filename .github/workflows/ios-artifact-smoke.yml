name: Verify hosted iOS simulator smoke
on:
  push:
    branches: [benchmark/ios-artifact-smoke-pilot-20261121]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    name: Smoke ${{ matrix.label }}
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: product
            run: "44545235646"
            sha: 45eb65d505fb51e9e1ac57915fee8d62fb0dce01
            test_sha: 4af6724ad8b797dcd4d6ee43d97820d950f72072
            job: "135638562659"
            name: ios-simulator
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify origin and locate artifact
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ matrix.run }}
          EXPECTED_SHA: ${{ matrix.sha }}
          JOB: ${{ matrix.job }}
          ARTIFACT: ${{ matrix.name }}
        run: bash .github/scripts/ios-artifact-origin.sh
      - name: Check out the product test suite with the updated Guides assertion
        if: matrix.label == 'product' && steps.origin.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.test_sha }}
          path: product
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: matrix.label == 'product' && steps.origin.outputs.ready == 'true'
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        if: matrix.label == 'product' && steps.origin.outputs.ready == 'true'
        with:
          bun-version: 1.4.5
      - name: Install product test dependencies
        if: matrix.label == 'product' && steps.origin.outputs.ready == 'true'
        working-directory: product
        run: bun install --frozen-lockfile --filter @disposabl/tests
      - name: Download and smoke simulator app
        if: steps.origin.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.origin.outputs.id }}
          ARTIFACT_DIGEST: ${{ steps.origin.outputs.digest }}
          PRODUCT_SOURCE: ${{ matrix.test_sha || '' }}
        run: bash .github/scripts/ios-artifact-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.origin.outputs.ready == 'true'
        with:
          name: ios-smoke-${{ matrix.label }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-smoke-evidence/
          if-no-files-found: warn
          retention-days: 3
