name: Benchmark iOS artifact smoke
on:
  push:
    branches: [benchmark/ios-artifact-smoke-*]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    name: Smoke ${{ matrix.label }}
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: product
            run: "44899216086"
            sha: cd5ddf7e3a70743b5e12c652b7667d04e3fe067b
            test_sha: 4af6724ad8b797dcd4d6ee43d97820d950f72072
            job: "136832362469"
            name: ios-simulator
          - label: generated
            run: "44900751287"
            sha: ff387a33827f9b19dd4fa241f6085296c8b94b2b
            job: "136836017366"
            name: first-ios-1
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify origin and locate artifact
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ matrix.run }}
          EXPECTED_SHA: ${{ matrix.sha }}
          JOB: ${{ matrix.job }}
          ARTIFACT: ${{ matrix.name }}
        run: bash .github/scripts/ios-artifact-origin.sh
      - name: Check out the product test suite with the updated Guides assertion
        if: matrix.label == 'product' && steps.origin.outputs.ready == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.test_sha }}
          path: product
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: matrix.label == 'product' && steps.origin.outputs.ready == 'true'
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        if: matrix.label == 'product' && steps.origin.outputs.ready == 'true'
        with:
          bun-version: 1.4.5
      - name: Install product test dependencies
        if: matrix.label == 'product' && steps.origin.outputs.ready == 'true'
        working-directory: product
        run: bun install --frozen-lockfile --filter @disposabl/tests
      - name: Download and verify simulator artifact
        if: steps.origin.outputs.ready == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.origin.outputs.id }}
          ARTIFACT_DIGEST: ${{ steps.origin.outputs.digest }}
        run: bash .github/scripts/ios-artifact-smoke.sh prepare
      - name: Create and boot simulator
        if: steps.origin.outputs.ready == 'true'
        timeout-minutes: 5
        run: bash .github/scripts/ios-artifact-smoke.sh boot
      - name: Install, launch and capture screenshot
        if: steps.origin.outputs.ready == 'true'
        timeout-minutes: 4
        run: bash .github/scripts/ios-artifact-smoke.sh launch
      - name: Run product TesterArmy checks
        if: matrix.label == 'product' && steps.origin.outputs.ready == 'true'
        timeout-minutes: 8
        env:
          PRODUCT_SOURCE: ${{ matrix.test_sha || '' }}
        run: bash .github/scripts/ios-artifact-smoke.sh test
      - name: Remove owned simulator
        if: always() && steps.origin.outputs.ready == 'true'
        timeout-minutes: 2
        run: bash .github/scripts/ios-artifact-smoke.sh cleanup
      - uses: actions/upload-artifact@v4
        if: always() && steps.origin.outputs.ready == 'true'
        with:
          name: ios-smoke-${{ matrix.label }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-smoke-evidence/
          if-no-files-found: warn
          retention-days: 3
