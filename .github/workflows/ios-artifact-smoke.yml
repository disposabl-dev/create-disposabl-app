name: First current generated iOS launch
on:
  push:
    branches: [benchmark/ios-artifact-smoke-latest-20261121]
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Verify first generated build provenance
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: "44909246374"
          EXPECTED_SHA: fdfcacb916e1c914462f894313ad4f6d45e800c7
          JOB: "136861433310"
          ARTIFACT: first-ios-1
        run: bash .github/scripts/ios-artifact-origin.sh
      - name: Install tests from the exact generated source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/generated-source.zip"
          gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/artifacts/14708343861/zip" > "$archive"
          printf '%s  %s\n' '8ac1ad71e911d957ed61a73f90e6a4d07181b6bca24717c7f083b5d094ce2991' "$archive" | shasum -a 256 --check
          mkdir "$RUNNER_TEMP/exact-source" "$RUNNER_TEMP/generated"
          unzip -q "$archive" -d "$RUNNER_TEMP/exact-source"
          (cd "$RUNNER_TEMP/exact-source" && shasum -a 256 --check native-starter.sha256)
          tar -xzf "$RUNNER_TEMP/exact-source/native-starter.tgz" -C "$RUNNER_TEMP/generated"
          cd "$RUNNER_TEMP/generated"
          bun install --frozen-lockfile --filter @disposabl/mobile --filter @disposabl/tests
      - name: Install and inspect the first generated app
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.origin.outputs.id }}
          ARTIFACT_DIGEST: ${{ steps.origin.outputs.digest }}
        run: |
          test -n "$ARTIFACT_ID"
          bash .github/scripts/ios-artifact-smoke.sh
          swiftc -O .github/scripts/ios-repack-ocr.swift -o "$RUNNER_TEMP/starter-ocr"
          "$RUNNER_TEMP/starter-ocr" "$RUNNER_TEMP/ios-smoke-evidence/screen.png" > "$RUNNER_TEMP/ios-smoke-evidence/screen-text.txt"
          grep -F 'Your app starts here.' "$RUNNER_TEMP/ios-smoke-evidence/screen-text.txt"
          grep -Fx Android "$RUNNER_TEMP/ios-smoke-evidence/screen-text.txt"
          grep -Fx iOS "$RUNNER_TEMP/ios-smoke-evidence/screen-text.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-generated-launch-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-smoke-evidence/
          if-no-files-found: warn
          retention-days: 1
