name: First current generated iOS launch
on:
  push:
    branches: [benchmark/ios-artifact-smoke-latest-20261121]
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify first generated build provenance
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: "44909246374"
          EXPECTED_SHA: fdfcacb916e1c914462f894313ad4f6d45e800c7
          JOB: "136861433310"
          ARTIFACT: first-ios-1
        run: bash .github/scripts/ios-artifact-origin.sh
      - name: Install and inspect the first generated app
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.origin.outputs.id }}
          ARTIFACT_DIGEST: ${{ steps.origin.outputs.digest }}
        run: |
          test -n "$ARTIFACT_ID"
          bash .github/scripts/ios-artifact-smoke.sh
          swiftc -O .github/scripts/ios-repack-ocr.swift -o "$RUNNER_TEMP/starter-ocr"
          "$RUNNER_TEMP/starter-ocr" "$RUNNER_TEMP/ios-smoke-evidence/screen.png" > "$RUNNER_TEMP/ios-smoke-evidence/screen-text.txt"
          grep -F 'Your app starts here.' "$RUNNER_TEMP/ios-smoke-evidence/screen-text.txt"
          grep -Fx Android "$RUNNER_TEMP/ios-smoke-evidence/screen-text.txt"
          grep -Fx iOS "$RUNNER_TEMP/ios-smoke-evidence/screen-text.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-generated-launch-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-smoke-evidence/
          if-no-files-found: warn
          retention-days: 1
