name: Comparable web benchmark
on:
  push:
    branches: [benchmark/github-20261101]
permissions: { contents: read }
defaults:
  run:
    working-directory: benchmark-app
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VITE_CONVEX_URL: https://ci.invalid
      VITE_CONVEX_SITE_URL: https://ci.invalid
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '24', package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: '1.4.4' }
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: webcompare-20261101-c-github-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('benchmark-app/bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: benchmark-app/.turbo/cache
          key: webcompare-20261101-c-github-turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('benchmark-app/bun.lock') }}
      - name: Runner information
        run: node -e 'const os=require("os");console.log(JSON.stringify({cpus:os.cpus().length,model:os.cpus()[0].model,memory:os.totalmem(),arch:os.arch()}))'
      - name: Install
        run: bun install --frozen-lockfile
      - name: Checks
        run: bun x --no-install turbo run typecheck lint && bun fmt --check && bun test --pass-with-no-tests
      - name: Web build
        run: bun run build --filter=!desktop
