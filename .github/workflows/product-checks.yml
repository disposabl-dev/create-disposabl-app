name: Product checks
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      cli_recovery_version:
        type: string
        default: ""
      recovery_version:
        type: string
        default: ""
    outputs:
      source_sha:
        value: ${{ jobs.check.outputs.source_sha }}
permissions:
  contents: read
jobs:
  check:
    name: Product / ${{ matrix.lane }}
    strategy:
      fail-fast: true
      matrix:
        lane: ${{ fromJSON((inputs.cli_recovery_version != '' || inputs.recovery_version != '') && '["unit","browser"]' || '["source","unit","browser","web-minimal","web-android","mobile-minimal","all-platforms"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      source_sha: ${{ steps.checks.outputs.source_sha }}
    env:
      GH_TOKEN: ""
      PYTHONDONTWRITEBYTECODE: "1"
      DO_NOT_TRACK: "1"
      E2E_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"
      DISPOSABL_ANALYTICS_ENABLED: "false"
      EXPO_PUBLIC_DISPOSABL_ANALYTICS_ENABLED: "false"
      VITE_DISPOSABL_ANALYTICS_ENABLED: "false"
    steps:
      - name: Validate immutable source
        env:
          EXPECTED_SOURCE: ${{ inputs.source_sha }}
        run: '[[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: ${{ (inputs.cli_recovery_version != '' || inputs.recovery_version != '') && '0' || '1' }}
          persist-credentials: false
      - name: Product checks
        id: checks
        uses: ./.github/actions/product-checks
        with:
          source_sha: ${{ inputs.source_sha }}
          lane: ${{ matrix.lane }}
          cli_recovery_version: ${{ inputs.cli_recovery_version }}
          recovery_version: ${{ inputs.recovery_version }}
