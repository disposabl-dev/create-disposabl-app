name: Releases
on:
  workflow_run:
    workflows: [Pipeline]
    types: [completed]
permissions:
  contents: write
  actions: read
  pull-requests: read
  id-token: write
concurrency:
  group: releases-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  publish:
    if: (github.event.workflow_run.event == 'pull_request' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')) && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE: ${{ github.event.workflow_run.head_sha }}
      SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
      DISPOSABL_SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
      DISPOSABL_RELEASE_VERSION: 1.0.${{ github.event.workflow_run.run_number }}
    steps:
      # Never check out or execute PR code in this privileged workflow.
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Disposabl installation token
        run: node .github/scripts/disposabl.mjs token
      - name: Select release source
        id: source
        run: |
          if [[ '${{ github.event.workflow_run.event }}' == push ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            echo 'CHANNEL=production' >> "$GITHUB_ENV"
            echo 'PRERELEASE=false' >> "$GITHUB_ENV"
            exit
          fi
          echo 'PRERELEASE=true' >> "$GITHUB_ENV"
          pr=$(gh api "repos/$GH_REPO/commits/$SOURCE/pulls" --jq ".[] | select(.state == \"open\" and .head.sha == \"$SOURCE\" and .head.repo.full_name == \"$GH_REPO\") | .number" | head -1)
          if [[ -z "$pr" ]]; then echo 'current=false' >> "$GITHUB_OUTPUT"; exit; fi
          echo 'current=true' >> "$GITHUB_OUTPUT"
          echo "CHANNEL=pr-$pr" >> "$GITHUB_ENV"
          echo "PR=$pr" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.current == 'true'
        with:
          github-token: ${{ env.GH_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: release-*
          path: artifacts
      - name: Publish verified build artifacts
        if: steps.source.outputs.current == 'true'
        shell: bash
        run: |
          check_source() {
            if [[ "$CHANNEL" == production ]]; then test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$SOURCE"
            else test "$(gh api "repos/$GH_REPO/pulls/$PR" --jq 'if .state == "open" then .head.sha else "closed" end')" = "$SOURCE"; fi
          }
          # Apple publication remains disabled along with the build jobs.
          for platform in android linux windows; do
            directory="artifacts/release-$platform"
            test -d "$directory" || continue
            check_source
            tag="app-$CHANNEL-$platform"
            if [[ "$CHANNEL" == production ]]; then tag+="-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}"; fi
            printf 'Platform: %s\nSource: %s\n' "$platform" "$SOURCE" > "$RUNNER_TEMP/release-notes.md"
            if [[ -f "$directory/android.json" ]]; then printf '<!-- android %s -->\n' "$(jq -c . "$directory/android.json")" >> "$RUNNER_TEMP/release-notes.md"; fi
            if gh release view "$tag" --json assets > "$RUNNER_TEMP/previous-release.json"; then
              gh release upload "$tag" "$directory/"* --clobber
              while IFS= read -r asset; do
                if [[ ! -f "$directory/$asset" ]]; then check_source; gh release delete-asset "$tag" "$asset" --yes; fi
              done < <(jq -r '.assets[].name' "$RUNNER_TEMP/previous-release.json")
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$SOURCE" -F force=true > /dev/null
            else
              gh release create "$tag" "$directory/"* --draft --target "$SOURCE" --title "$CHANNEL / $platform" --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease="$PRERELEASE"
            fi
            check_source
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false --prerelease="$PRERELEASE" --latest=false
            node .github/scripts/disposabl.mjs release "$platform" "$tag"
          done
