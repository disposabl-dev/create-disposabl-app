name: Prepare Play bundle (manual)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact current main commit SHA
        required: true
        type: string
      upload_cert_sha256:
        description: Optional independently verified Play upload certificate SHA-256
        required: false
        type: string
      previous_version_code:
        description: Optional freshly verified highest Play version code
        required: false
        type: string
      next_version_code:
        description: Candidate version code; Play acceptance remains unverified
        required: true
        type: string
      convex_url:
        description: Verified production Convex HTTPS origin
        required: true
        type: string
      convex_site_url:
        description: Verified production Convex site HTTPS origin
        required: true
        type: string
      analytics_enabled:
        description: Verified production public analytics setting
        required: true
        type: choice
        options: ["false", "true"]
      update_policy:
        description: Verified production update policy
        required: true
        type: choice
        options: [disabled, expo]
      expo_project_id:
        description: Verified Expo project ID, required only for expo update policy
        required: false
        type: string
      storage_budget_verified:
        description: One-day artifact storage and runner budget independently verified
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STORAGE_BUDGET_VERIFIED: ${{ inputs.storage_budget_verified }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
      PLAY_PACKAGE_ID: com.yastai.disposabl
      PLAY_UPLOAD_CERT_SHA256: ${{ inputs.upload_cert_sha256 }}
      PLAY_PREVIOUS_VERSION_CODE: ${{ inputs.previous_version_code }}
      DISPOSABL_ANDROID_VERSION_CODE: ${{ inputs.next_version_code }}
      EXPO_PUBLIC_CONVEX_URL: ${{ inputs.convex_url }}
      EXPO_PUBLIC_CONVEX_SITE_URL: ${{ inputs.convex_site_url }}
      EXPO_PUBLIC_DISPOSABL_ANALYTICS_ENABLED: ${{ inputs.analytics_enabled }}
      UPDATE_POLICY: ${{ inputs.update_policy }}
      EXPO_PROJECT_ID: ${{ inputs.expo_project_id }}
      DISPOSABL_MOBILE_CHANNEL: production
      DISPOSABL_ANDROID_CHANNEL: production
      DO_NOT_TRACK: "1"
      BUN_TELEMETRY_DISABLE: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_DOTENV: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Verify exact current main
        run: bash .github/scripts/play-bundle.sh verify-source
      - uses: actions/setup-node@v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile --filter @disposabl/mobile
      - name: Download verified bundletool
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check --status
      - name: Build and verify candidate
        env:
          DISPOSABL_ANDROID_SIGNING: ${{ secrets.DISPOSABL_ANDROID_SIGNING }}
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
        run: bash .github/scripts/play-bundle.sh build
      - name: Recheck current main before retention
        run: bash .github/scripts/play-bundle.sh verify-source
      - name: Retain candidate for one day
        uses: actions/upload-artifact@v4
        with:
          name: play-aab-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
