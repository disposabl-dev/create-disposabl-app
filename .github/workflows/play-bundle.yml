name: Android Play submission

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-play-production
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
      PLAY_PACKAGE_ID: com.yastai.disposabl
      EXPO_PUBLIC_CONVEX_URL: https://vivid-caterpillar-633.convex.cloud
      EXPO_PUBLIC_CONVEX_SITE_URL: https://vivid-caterpillar-633.convex.site
      EXPO_PUBLIC_DISPOSABL_ANALYTICS_ENABLED: "true"
      UPDATE_POLICY: disabled
      EXPO_PROJECT_ID: ""
      DISPOSABL_MOBILE_CHANNEL: production
      DISPOSABL_ANDROID_CHANNEL: production
      DO_NOT_TRACK: "1"
      BUN_TELEMETRY_DISABLE: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_NO_DOTENV: "1"
      E2E_TELEMETRY_DISABLED: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v6
        with: { persist-credentials: false }
      - name: Verify exact current main
        run: bash .github/scripts/play-bundle.sh verify-source
      - uses: actions/setup-node@v6
        with: { node-version: "24", package-manager-cache: false }
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.4.4" }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile --filter @disposabl/mobile
      - name: Download verified bundletool
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar \
            --output "$RUNNER_TEMP/bundletool.jar"
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check --status
      - name: Build signed production bundle
        env:
          DISPOSABL_ANDROID_SIGNING: ${{ secrets.DISPOSABL_ANDROID_SIGNING }}
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
        run: |
          version=$(date -u +%s)
          [[ "$version" =~ ^[1-9][0-9]*$ && "$version" -le 2100000000 ]] || { echo 'Cannot allocate a valid candidate version code' >&2; exit 1; }
          echo "Candidate version code: $version; availability on Play remains unchecked."
          export DISPOSABL_ANDROID_VERSION_CODE="$version"
          bash .github/scripts/play-bundle.sh build
      - name: Submit production bundle to Play
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID || vars.EXPO_PROJECT_ID }}
          EXPO_OWNER: ${{ secrets.EXPO_OWNER || vars.EXPO_OWNER }}
          EXPO_SLUG: ${{ secrets.EXPO_SLUG || vars.EXPO_SLUG }}
        run: |
          : "${EXPO_TOKEN:?Expo token is required for submission}"
          : "${EXPO_PROJECT_ID:?Verified Expo submission project ID is required}"
          bash "$GITHUB_WORKSPACE/.github/scripts/play-bundle.sh" verify-source
          bun x eas-cli@27.2.0 submit --platform android --profile production --path android/app/build/outputs/bundle/release/app-release.aab --non-interactive --wait
          echo 'Expo reports a completed submission. Play review and rollout are separate.' >> "$GITHUB_STEP_SUMMARY"
