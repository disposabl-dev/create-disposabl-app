name: Product static E2E benchmark
on:
  push:
    branches: [benchmark/web-static-e2e-20261121]
permissions:
  contents: read
jobs:
  benchmark:
    if: github.repository == 'disposabl-dev/create-disposabl-app'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arm: [vite, static]
        shard: ["3/4", "4/4"]
    env:
      GH_TOKEN: ""
      PYTHONDONTWRITEBYTECODE: "1"
      DO_NOT_TRACK: "1"
      E2E_TELEMETRY_DISABLED: "1"
      DISPOSABL_ANALYTICS_ENABLED: "false"
      EXPO_PUBLIC_DISPOSABL_ANALYTICS_ENABLED: "false"
      VITE_DISPOSABL_ANALYTICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/product-checks
        with:
          source_sha: ${{ github.sha }}
          lane: browser
          browser_shard: ${{ matrix.shard }}
          browser_arm: ${{ matrix.arm }}
