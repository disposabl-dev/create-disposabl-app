name: Android Gradle heap comparison
on:
  push:
    branches: [benchmark/ci-android-gradle-heap-20261121]
permissions:
  contents: read
  actions: read
jobs:
  apk:
    if: github.repository == 'disposabl-dev/create-disposabl-app'
    name: Android preview with 4 GiB Gradle heap
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPO_NO_DOTENV: "1"
      EXPO_NO_TELEMETRY: "1"
      E2E_TELEMETRY_DISABLED: "1"
      EXPO_PROJECT_ID: 00000000-0000-4000-8000-000000000001
      EXPO_PUBLIC_CONVEX_URL: https://ci.invalid
      EXPO_PUBLIC_CONVEX_SITE_URL: https://ci.invalid
      DISPOSABL_MOBILE_CHANNEL: native-benchmark
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44900751287
          name: native-starter-1
          path: .fixture
      - name: Verify the starter shared by both variants
        run: |
          (cd .fixture && shasum -a 256 --check native-starter.sha256)
          mkdir generated
          tar -xzf .fixture/native-starter.tgz -C generated
          test ! -d generated/apps/mobile/android
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile --filter @disposabl/mobile
        working-directory: generated
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build and verify the APK from cold state
        working-directory: generated/apps/mobile
        run: |
          bash ../../.github/scripts/android-runner.sh prepare
          bash ../../.github/scripts/android-runner.sh check
          bun x --no-install expo prebuild --platform android --no-install
          free -m
          (cd android && bash ../../../.github/scripts/android-runner.sh build :app:assembleRelease --profile "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m")
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -tq "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$signer" verify --print-certs "$apk"
          jq '{androidArchitectures}' ../../disposabl.json > "$RUNNER_TEMP/abi.json"
          node ../../.github/scripts/verify-android-abis.mjs "$apk" "$RUNNER_TEMP/abi.json"
          wc -c "$apk"
          report=$(find android -type f -path '*/reports/profile/profile-*.html' -print -quit)
          test -s "$report"
          sed -n '/minifyReleaseWithR8/{N;p}' "$report"
