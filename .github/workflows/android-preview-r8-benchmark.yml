name: Android preview R8 comparison
on:
  push:
    branches: [benchmark/ci-android-preview-r8-20261121]
permissions:
  contents: read
  actions: read
jobs:
  apk:
    if: github.repository == 'disposabl-dev/create-disposabl-app'
    name: Android preview / ${{ matrix.optimization }}
    strategy:
      fail-fast: false
      matrix:
        optimization: [r8, unminified]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXPO_NO_DOTENV: "1"
      EXPO_NO_TELEMETRY: "1"
      E2E_TELEMETRY_DISABLED: "1"
      EXPO_PROJECT_ID: 00000000-0000-4000-8000-000000000001
      EXPO_PUBLIC_CONVEX_URL: https://ci.invalid
      EXPO_PUBLIC_CONVEX_SITE_URL: https://ci.invalid
      DISPOSABL_MOBILE_CHANNEL: native-benchmark
      ANDROID_OPTIMIZATION: ${{ matrix.optimization }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 44900751287
          name: native-starter-1
          path: .fixture
      - name: Verify the starter shared by both variants
        run: |
          (cd .fixture && shasum -a 256 --check native-starter.sha256)
          mkdir generated
          tar -xzf .fixture/native-starter.tgz -C generated
          test ! -d generated/apps/mobile/android
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - run: bun install --frozen-lockfile --filter @disposabl/mobile
        working-directory: generated
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build and verify the APK from cold state
        working-directory: generated/apps/mobile
        run: |
          bash ../../.github/scripts/android-runner.sh prepare
          bash ../../.github/scripts/android-runner.sh check
          bun x --no-install expo prebuild --platform android --no-install
          flags=()
          if [[ "$ANDROID_OPTIMIZATION" == unminified ]]; then
            flags+=(-Pandroid.enableMinifyInReleaseBuilds=false -Pandroid.enableShrinkResourcesInReleaseBuilds=false)
          fi
          (cd android && bash ../../../.github/scripts/android-runner.sh build :app:assembleRelease "${flags[@]}")
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -tq "$apk"
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$signer" verify --print-certs "$apk"
          manifest=$(jq -c '{androidArchitectures}' ../../disposabl.json)
          node ../../.github/scripts/verify-android-abis.mjs "$apk" "$manifest"
          wc -c "$apk"
      - uses: actions/upload-artifact@v4
        if: matrix.optimization == 'unminified'
        with:
          name: first-unminified-apk-${{ github.run_attempt }}
          path: generated/apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
