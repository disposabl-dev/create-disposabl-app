name: Full product cold Android without preview R8
on:
  push:
    branches: [benchmark/ci-full-product-no-r8-20261121]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "1"
  DO_NOT_TRACK: "1"
  E2E_TELEMETRY_DISABLED: "1"
  EXPO_NO_TELEMETRY: "1"
  EXPO_NO_DOTENV: "1"
  DISPOSABL_ANALYTICS_ENABLED: "false"
  EXPO_PUBLIC_DISPOSABL_ANALYTICS_ENABLED: "false"
  VITE_DISPOSABL_ANALYTICS_ENABLED: "false"
  EXPO_PROJECT_ID: 00000000-0000-4000-8000-000000000001
  CONVEX_URL: https://ci.invalid
  CONVEX_SITE_URL: https://ci.invalid
  PUBLIC_SITE_URL: https://ci.invalid
  EXPO_PUBLIC_CONVEX_URL: https://ci.invalid
  EXPO_PUBLIC_CONVEX_SITE_URL: https://ci.invalid
  CHANNEL: benchmark
  DISPOSABL_MOBILE_CHANNEL: benchmark
  DISPOSABL_ANDROID_CHANNEL: benchmark
  DISPOSABL_ANDROID_VERSION_CODE: "1"
  DISPOSABL_IOS_BUILD_NUMBER: "1"
  SOURCE: ${{ github.sha }}
  SOURCE_PATH: git/ref/heads/benchmark/ci-full-product-no-r8-20261121
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  android:
    if: github.repository == 'disposabl-dev/create-disposabl-app' && github.ref == 'refs/heads/benchmark/ci-full-product-no-r8-20261121'
    name: Cold product Android preview without R8
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Verify product source and cold dependency state
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          jq -e '.features | index("payments")' disposabl.json >/dev/null
          jq -e '.androidArchitectures == ["arm64-v8a", "x86_64"]' disposabl.json >/dev/null
          test ! -e apps/mobile/android
          mkdir -p "$RUNNER_TEMP/cold-gradle"
          test -z "$(ls -A "$RUNNER_TEMP/cold-gradle")"
          printf 'GRADLE_USER_HOME=%s\n' "$RUNNER_TEMP/cold-gradle" >> "$GITHUB_ENV"
          printf 'Source %s\nTree %s\n' "$SOURCE" "$(git rev-parse HEAD^{tree})"
          node -e 'const os=require("node:os");console.log(JSON.stringify({cpus:os.availableParallelism(),memory:os.totalmem(),arch:os.arch()}))'
          bun --version
          node --version
      - name: Install frozen mobile dependencies
        run: /usr/bin/time -p bun install --frozen-lockfile --filter @disposabl/mobile
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android runner
        run: bash .github/scripts/android-runner.sh prepare
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Disable shrinking in this isolated preview
        run: |
          echo 'GRADLE_OPTS=-Dorg.gradle.project.android.enableMinifyInReleaseBuilds=false -Dorg.gradle.project.android.enableShrinkResourcesInReleaseBuilds=false' >> "$GITHUB_ENV"
      - name: Build and verify the real product preview APK
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          runtime=$(bun x --no-install expo-updates runtimeversion:resolve --platform android --workflow managed | jq -er '.runtimeVersion | select(test("^[a-f0-9]{40,64}$"))')
          export RUNTIME="$runtime"
          /usr/bin/time -p bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" android-build
          apk="$GITHUB_WORKSPACE/dist/release/android.apk"
          metadata="$GITHUB_WORKSPACE/dist/release/android.json"
          test -s "$apk" && test -s "$metadata"
          jq -e --arg runtime "$runtime" '
            .action == "build" and .signing == "fallback" and .channel == "benchmark" and
            .projectId == "00000000-0000-4000-8000-000000000001" and
            .applicationId == "com.yastai.disposabl.benchmark" and .runtimeVersion == $runtime and
            .androidArchitectures == ["arm64-v8a", "x86_64"] and
            (.sha256 | test("^[a-f0-9]{64}$")) and
            (.certificateSha256 | test("^[a-f0-9]{64}$"))
          ' "$metadata" >/dev/null
          printf '%s  %s\n' "$(jq -er .sha256 "$metadata")" "$apk" | sha256sum --check
          unzip -tq "$apk"
          node "$GITHUB_WORKSPACE/.github/scripts/verify-android-abis.mjs" "$apk" "$(cat "$metadata")"
          node "$GITHUB_WORKSPACE/.github/scripts/android-signatures.mjs" "$apk" "$(jq -er .certificateSha256 "$metadata")"
          test "$(unzip -p "$apk" assets/fingerprint)" = "$runtime"
          printf '%s\n' "$SOURCE" > "$GITHUB_WORKSPACE/dist/release/source.sha"
          du -h "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: full-product-android-unminified-${{ github.run_attempt }}
          path: dist/release/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
