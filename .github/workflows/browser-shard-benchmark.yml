name: Full product isolated browser distribution benchmark
on:
  push:
    branches: [benchmark/product-browser-shards-20261121]
permissions:
  contents: read
jobs:
  browser:
    name: Browser / ${{ matrix.variant }} / ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: baseline, shard: 1/4, workers: 1 }
          - { variant: baseline, shard: 2/4, workers: 1 }
          - { variant: baseline, shard: 3/4, workers: 1 }
          - { variant: baseline, shard: 4/4, workers: 1 }
          - { variant: workers, shard: 1/4, workers: 2 }
          - { variant: workers, shard: 2/4, workers: 2 }
          - { variant: workers, shard: 3/4, workers: 2 }
          - { variant: workers, shard: 4/4, workers: 2 }
          - { variant: shards, shard: 1/6, workers: 1 }
          - { variant: shards, shard: 2/6, workers: 1 }
          - { variant: shards, shard: 3/6, workers: 1 }
          - { variant: shards, shard: 4/6, workers: 1 }
          - { variant: shards, shard: 5/6, workers: 1 }
          - { variant: shards, shard: 6/6, workers: 1 }
    env:
      GH_TOKEN: ""
      PYTHONDONTWRITEBYTECODE: "1"
      DO_NOT_TRACK: "1"
      E2E_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"
      DISPOSABL_ANALYTICS_ENABLED: "false"
      EXPO_PUBLIC_DISPOSABL_ANALYTICS_ENABLED: "false"
      VITE_DISPOSABL_ANALYTICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify full product source
        run: git diff --exit-code 48630a83 "$GITHUB_SHA" -- apps packages bun.lock disposabl.json
      - uses: ./.github/actions/product-checks
        with:
          source_sha: ${{ github.sha }}
          lane: browser
          browser_shard: ${{ matrix.shard }}
          proof_workers: ${{ matrix.workers }}
      - uses: actions/upload-artifact@v4
        with:
          name: browser-${{ matrix.variant }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/browser-proof.json
          retention-days: 1
          if-no-files-found: error
  compare:
    needs: browser
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: browser-*
          path: results
      - name: Compare test identities and outcomes
        run: |
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json
          root = Path('results')
          results = {}
          for variant, count in [('baseline', 4), ('workers', 4), ('shards', 6)]:
              reports = list(root.glob(f'browser-{variant}-*/browser-proof.json'))
              if len(reports) != count:
                  raise ValueError(f'Missing {variant} shard reports')
              cases = Counter()
              for report in reports:
                  records = json.loads(report.read_text())
                  cases.update((identity, result) for identity, result, _ in records)
                  print(report.parent.name, Counter(result for _, result, _ in records),
                        'sum of test seconds', round(sum(ms for *_, ms in records) / 1000, 2))
              if sum(cases.values()) != 76:
                  raise ValueError(f'{variant} must contain all 76 test-target results')
              results[variant] = cases
          if not results['baseline'] == results['workers'] == results['shards']:
              raise ValueError('Selected test identities or outcomes changed')
          print('All 76 selected product test identities and results match.')
          PY
