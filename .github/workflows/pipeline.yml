name: Preview
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CHANNEL: &channel ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
  DISPOSABL_MOBILE_CHANNEL: *channel
  EAS_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'preview' }}
  EAS_CLI: eas-cli@27.2.0
  IOS_BUILD_ENABLED: ${{ vars.IOS_BUILD_ENABLED || 'false' }}
  IOS_BUILD_REVISION: ${{ vars.IOS_BUILD_REVISION || '1' }}
  BUN_VERSION: &bun-version '1.4.4'
  NODE_VERSION: &node-version '24'
  LINUX_RUNNER: &linux-runner blacksmith-4vcpu-ubuntu-2404
  WINDOWS_RUNNER: &windows-runner blacksmith-4vcpu-windows-2025
  MACOS_RUNNER: &macos-runner blacksmith-6vcpu-macos-26
  MACOS_BUNDLE_ID: dev.disposabl.starter.desktop
  RELEASE_PREFIX: app
  DISPOSABL_ANDROID_VERSION_CODE: ${{ github.run_number }}
  DISPOSABL_IOS_BUILD_NUMBER: ${{ github.run_number }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_PATH: ${{ github.event_name == 'pull_request' && format('pulls/{0}', github.event.number) || 'git/ref/heads/main' }}
  DISPOSABL_RELEASE_VERSION: 1.0.${{ github.run_number }}

jobs:
  web:
    name: Web + Android
    permissions: &release-permissions
      contents: write
      pull-requests: read
    timeout-minutes: 45
    runs-on: *linux-runner
    outputs:
      ios_build: ${{ steps.ios.outputs.build }}
      ios_manifest: ${{ steps.ios.outputs.manifest }}
      convex_url: ${{ steps.deploy.outputs.CONVEX_URL }}
      convex_site_url: ${{ steps.deploy.outputs.CONVEX_SITE_URL }}
    env:
      PLATFORM: android
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EXPO_SLUG: ${{ vars.EXPO_SLUG }}
      EXPO_NO_DOTENV: '1'
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v6
        with: {ref: "${{ env.SOURCE }}", persist-credentials: false}
      - &platforms
        name: Platforms
        shell: bash
        id: platforms
        env:
          BEFORE: ${{ github.event.before }}
          PR: ${{ github.event.number }}
          TRUSTED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ "$TRUSTED" != true ]]; then printf 'android=false\nios=false\ndesktop=[]\nselected=false\n' >> "$GITHUB_OUTPUT"; exit; fi
          if [[ -n "$PR" ]]; then
            gh api "repos/$GH_REPO/pulls/$PR/files?per_page=100" --paginate --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changes"
          elif [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then echo disposabl.json > "$RUNNER_TEMP/changes"
          else
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --depth=1 origin "$BEFORE"
            git diff --name-only --no-renames "$BEFORE" "$SOURCE" > "$RUNNER_TEMP/changes"
          fi
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const paths = readFileSync(`${process.env.RUNNER_TEMP}/changes`, "utf8").split("\n").filter(p => !/(^|\/)\.agents\/|\.(md|mdx)$/.test(p));
            const enabled = JSON.parse(readFileSync("disposabl.json", "utf8")).platforms;
            const shared = paths.some(p => /^(bun.lock$|package.json$|disposabl.json$|turbo.json$|bunfig.toml$|patches\/|\.github\/workflows\/pipeline.yml$|packages\/(?!backend\/|create-disposabl-app\/))/.test(p));
            const mobile = shared || paths.some(p => p.startsWith("apps/mobile/"));
            for (const platform of ["android", "ios"]) console.log(`${platform}=${enabled.includes(platform) && mobile}`);
            const desktop = ["linux", "windows", "macos"].filter(platform => enabled.includes(platform) && (shared || paths.some(p => p.startsWith("apps/desktop/"))));
            console.log(`desktop=${JSON.stringify(desktop)}\nselected=${desktop.includes(process.env.DISPOSABL_DESKTOP_PLATFORM)}`);
          ' >> "$GITHUB_OUTPUT"
      - &node
        name: Node
        if: github.job != 'desktop' || steps.platforms.outputs.selected == 'true'
        uses: actions/setup-node@v6
        with: {node-version: *node-version, package-manager-cache: false}
      - &bun
        name: Bun
        if: github.job != 'desktop' || steps.platforms.outputs.selected == 'true'
        uses: oven-sh/setup-bun@v2
        with: {bun-version: *bun-version}
      - &cache
        name: Cache
        if: github.job != 'desktop' || steps.platforms.outputs.selected == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ github.job == 'desktop' && 'desktop-' || '' }}${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ github.job == 'desktop' && 'desktop-' || '' }}${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - &install
        name: Install
        if: github.job != 'desktop' || steps.platforms.outputs.selected == 'true'
        run: bun install --frozen-lockfile ${{ github.job == 'desktop' && '--filter desktop' || github.job == 'ios' && '--filter @disposabl/mobile' || '' }}
      - name: Check
        run: bun run check
      - name: Deploy
        id: deploy
        env:
          TRUSTED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          CONVEX_DEPLOY_KEY: ${{ secrets[github.event_name == 'push' && 'CONVEX_DEPLOY_KEY' || 'CONVEX_DEPLOY_KEY_PREVIEW'] }}
        run: |
          if [[ "$TRUSTED" != true ]]; then VITE_CONVEX_URL=https://ci.invalid VITE_CONVEX_SITE_URL=https://ci.invalid bun run build --filter=@disposabl/web; exit; fi
          : "${CONVEX_DEPLOY_KEY:?Configure the Convex deployment secret for this repository}"
          cd packages/backend
          export AUTH_TARGET=--prod
          target=()
          if [[ "$CHANNEL" != production ]]; then export AUTH_TARGET="--preview-name $CHANNEL"; target=(--preview-name "$CHANNEL"); fi
          bun x --no-install convex deploy --yes "${target[@]}" --cmd-url-env-var-name CONVEX_URL --cmd 'for name in CONVEX_URL CONVEX_SITE_URL; do value=$(printenv "$name"); test -n "$value" || exit 1; for prefix in "" VITE_ EXPO_PUBLIC_; do export "$prefix$name=$value"; printf "%s=%s\n" "$prefix$name" "$value" | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"; done; done; bun x --no-install --package @convex-dev/auth auth --keys-only $AUTH_TARGET && bun run --cwd ../.. build --filter=@disposabl/web'
          bun x --no-install static-hosting upload $AUTH_TARGET --no-spa --dist ../../apps/web/dist/client
      - &expo
        name: Expo
        if: github.job == 'ios' || steps.platforms.outputs.android == 'true' || steps.platforms.outputs.ios == 'true'
        working-directory: apps/mobile
        run: |
          jq --arg channel "$CHANNEL" '.build["ios-" + env.EAS_ENVIRONMENT].channel = $channel' eas.json > "$RUNNER_TEMP/eas.json"
          mv "$RUNNER_TEMP/eas.json" eas.json
          bun x "$EAS_CLI" env:pull --environment "$EAS_ENVIRONMENT" --path "$RUNNER_TEMP/expo.env" --non-interactive
          bun -e '
            import {parseEnv} from "node:util";
            import {appendFileSync, readFileSync} from "node:fs";
            for (const [key, value] of Object.entries(parseEnv(readFileSync(`${process.env.RUNNER_TEMP}/expo.env`, "utf8")))) {
              // Web and mobile use the same backend from this deployment.
              if (/^CONVEX_(URL|SITE_URL)$/.test(key) && value !== process.env[key]) throw new Error(`EAS overrides the deployed backend: ${key}`);
              if (/^(EXPO_PUBLIC_|VITE_)?CONVEX_(URL|SITE_URL)$/.test(key)) continue;
              if (/^(GITHUB_|RUNNER_|GH_|DISPOSABL_|BUN_|IOS_BUILD_|CI$|NODE_OPTIONS$|PATH$|HOME$|SOURCE(_PATH)?$|CHANNEL$|PLATFORM$|RELEASE_PREFIX$|MACOS_|EAS_(ENVIRONMENT|CLI)$|EXPO_(TOKEN|PROJECT_ID|OWNER|SLUG|NO_DOTENV)$)/.test(key)) throw new Error(`Reserved EAS variable: ${key}`);
              const delimiter = crypto.randomUUID();
              appendFileSync(process.env.GITHUB_ENV, `${key}<<${delimiter}\n${value}\n${delimiter}\n`);
            }
          '
      - name: Channel
        if: steps.platforms.outputs.android == 'true' || steps.platforms.outputs.ios == 'true'
        working-directory: apps/mobile
        run: |
          for ((offset=0; ; offset+=25)); do
            bun x "$EAS_CLI" channel:list --json --limit 25 --offset "$offset" > "$RUNNER_TEMP/channels.json"
            if jq -e --arg channel "$CHANNEL" 'any(.currentPage[]; .name == $channel)' "$RUNNER_TEMP/channels.json" > /dev/null; then
              jq -e --arg channel "$CHANNEL" '.currentPage[] | select(.name == $channel) | (.isPaused == false) and (.updateBranches | length == 1) and (.updateBranches[0].name == $channel) and ((.branchMapping | fromjson).data == [{branchId: .updateBranches[0].id, branchMappingLogic: "true"}])' "$RUNNER_TEMP/channels.json" > /dev/null || { echo 'Preview channel must point only to its same-named branch'; exit 1; }
              break
            fi
            if [[ $(jq '.currentPage | length' "$RUNNER_TEMP/channels.json") -lt 25 ]]; then bun x "$EAS_CLI" channel:create "$CHANNEL" --non-interactive; break; fi
          done
      - name: Fingerprint
        id: fingerprint
        if: steps.platforms.outputs.android == 'true'
        working-directory: apps/mobile
        run: |
          for ((page=1; ; page++)); do
            gh api "repos/$GH_REPO/releases?per_page=100&page=$page" > "$RUNNER_TEMP/releases.json"
            jq --arg tag "$RELEASE_PREFIX-$CHANNEL-android" --arg legacy "$RELEASE_PREFIX-$CHANNEL" '[.[] | select(.draft | not) | select(.tag_name == $tag or .tag_name == $legacy or (.tag_name | startswith($legacy + "-"))) | select(any(.assets[]; .name == "android.apk"))] | sort_by(.tag_name != $tag, .tag_name != $legacy) | .[0] // {}' "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/release.json"
            if jq -e '.id' "$RUNNER_TEMP/release.json" > /dev/null || [[ $(jq length "$RUNNER_TEMP/releases.json") -lt 100 ]]; then break; fi
          done
          bun x --no-install expo config --json > "$RUNNER_TEMP/mobile.json"
          RUNTIME=$(bun x --no-install expo-updates runtimeversion:resolve --platform android --workflow managed | jq -er 'select(.fingerprintSources != null) | .runtimeVersion | select(test("^[a-f0-9]{40,64}$"))')
          export RUNTIME
          bun -e '
            const config = await Bun.file(`${process.env.RUNNER_TEMP}/mobile.json`).json();
            if (!config.extra?.eas?.projectId) throw new Error("Link an Expo project first");
            const wanted = {channel: process.env.CHANNEL, projectId: config.extra.eas.projectId, applicationId: config.android.package, runtimeVersion: process.env.RUNTIME};
            const release = await Bun.file(`${process.env.RUNNER_TEMP}/release.json`).json();
            const prior = JSON.parse(/<!-- android (\{[^\n]+\}) -->/.exec(release.body || "")?.[1] || "null");
            const reusable = prior && Object.keys(wanted).every(k => prior[k] === wanted[k]) && /^[a-f0-9]{64}$/.test(prior.sha256 || "") && release.assets.some(a => a.name === "android.apk" && a.state === "uploaded" && a.size > 0 && a.digest === `sha256:${prior.sha256}`);
            console.log(`build=${!reusable}\nruntime=${wanted.runtimeVersion}\nmanifest=${JSON.stringify(wanted)}\ntag=${reusable ? release.tag_name : ""}\nsha=${reusable ? prior.sha256 : ""}`);
          ' >> "$GITHUB_OUTPUT"
      - name: Update
        if: steps.fingerprint.outputs.build == 'false'
        env:
          TAG: ${{ steps.fingerprint.outputs.tag }}
          SHA: ${{ steps.fingerprint.outputs.sha }}
          RUNTIME: ${{ steps.fingerprint.outputs.runtime }}
          MANIFEST: ${{ steps.fingerprint.outputs.manifest }}
        run: |
          mkdir -p dist/release
          gh release download "$TAG" --pattern android.apk --dir dist/release
          echo "$SHA  dist/release/android.apk" | sha256sum --check
          cd apps/mobile
          bun x --no-install expo export --platform android --output-dir dist/update
          test "$(bun x --no-install expo-updates runtimeversion:resolve --platform android --workflow managed | jq -er .runtimeVersion)" = "$RUNTIME"
          test "$(gh api "repos/$GH_REPO/$SOURCE_PATH" --jq 'if has("head") then (if .state == "open" then .head.sha else "closed" end) else .object.sha end')" = "$SOURCE"
          bun x "$EAS_CLI" update --platform android --channel "$CHANNEL" --environment "$EAS_ENVIRONMENT" --skip-bundler --input-dir dist/update --message "$SOURCE" --non-interactive
          jq --arg sha "$SHA" '. + {sha256: $sha, action: "update"}' <<< "$MANIFEST" > ../../dist/release/android.json
      - name: iOS
        id: ios
        if: steps.platforms.outputs.ios == 'true'
        working-directory: apps/mobile
        run: |
          runtime() { bun x --no-install expo-updates runtimeversion:resolve --platform ios --workflow managed | jq -er '.runtimeVersion | select(test("^[a-f0-9]{40,64}$"))'; }
          fingerprint=$(runtime)
          bun x --no-install expo config --json > "$RUNNER_TEMP/ios-config.json"
          gh api "repos/$GH_REPO/releases?per_page=100" --paginate --slurp | jq --arg tag "$RELEASE_PREFIX-$CHANNEL-ios" 'add | map(select(.draft | not) | select(.tag_name == $tag or (.tag_name | startswith($tag + "-")))) | .[0] // {}' > "$RUNNER_TEMP/ios-release.json"
          RUNTIME="$fingerprint" bun -e '
            const config = await Bun.file(`${process.env.RUNNER_TEMP}/ios-config.json`).json();
            const wanted = {channel: process.env.CHANNEL, projectId: config.extra.eas.projectId, applicationId: config.ios.bundleIdentifier, runtimeVersion: process.env.RUNTIME, provisioningRevision: process.env.IOS_BUILD_REVISION};
            const release = await Bun.file(`${process.env.RUNNER_TEMP}/ios-release.json`).json();
            const prior = JSON.parse(/<!-- ios (\{[^\n]+\}) -->/.exec(release.body || "")?.[1] || "null");
            const reusable = prior && Object.keys(wanted).every(k => prior[k] === wanted[k]) && Date.parse(prior.expiresAt) > Date.now() && /^[a-f0-9]{64}$/.test(prior.sha256 || "") && release.assets.some(a => a.name === "ios.ipa" && a.state === "uploaded" && a.size > 0 && a.digest === `sha256:${prior.sha256}`);
            await Bun.write(`${process.env.RUNNER_TEMP}/ios-build`, String(!reusable));
            console.log(`build=${!reusable}\nmanifest=${JSON.stringify(wanted)}`);
          ' >> "$GITHUB_OUTPUT"
          if [[ $(cat "$RUNNER_TEMP/ios-build") == true ]]; then echo "iOS needs a new signed IPA. Native builds enabled: $IOS_BUILD_ENABLED. Enable IOS_BUILD_ENABLED after configuring EAS ad hoc credentials." >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          bun x --no-install expo export --platform ios --output-dir dist/update-ios
          test "$(runtime)" = "$fingerprint"
          test "$(gh api "repos/$GH_REPO/$SOURCE_PATH" --jq 'if has("head") then (if .state == "open" then .head.sha else "closed" end) else .object.sha end')" = "$SOURCE"
          bun x "$EAS_CLI" update --platform ios --channel "$CHANNEL" --environment "$EAS_ENVIRONMENT" --skip-bundler --input-dir dist/update-ios --message "$SOURCE" --non-interactive
          echo "iOS update published to $CHANNEL." >> "$GITHUB_STEP_SUMMARY"
      - name: Java
        if: steps.fingerprint.outputs.build == 'true'
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: SDK
        if: steps.fingerprint.outputs.build == 'true'
        uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - name: Gradle
        if: steps.fingerprint.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v4
        with: {cache-read-only: false}
      - name: Build
        if: steps.fingerprint.outputs.build == 'true'
        working-directory: apps/mobile
        env:
          RUNTIME: ${{ steps.fingerprint.outputs.runtime }}
          DISPOSABL_ANDROID_CHANNEL: *channel
          MANIFEST: ${{ steps.fingerprint.outputs.manifest }}
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          test "$(gh api "repos/$GH_REPO/$SOURCE_PATH" --jq 'if has("head") then (if .state == "open" then .head.sha else "closed" end) else .object.sha end')" = "$SOURCE"
          if [[ "$CHANNEL" == production ]]; then
            : "${ANDROID_KEYSTORE_BASE64:?}" "${ANDROID_KEYSTORE_PASSWORD:?}" "${ANDROID_KEY_ALIAS:?}" "${ANDROID_KEY_PASSWORD:?}"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/android-release.jks"
            trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
            (umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH")
          fi
          bun x --no-install expo prebuild --platform android --no-install
          test "$(bun x --no-install expo-updates runtimeversion:resolve --platform android --workflow managed | jq -er .runtimeVersion)" = "$RUNTIME"
          (cd android && ./gradlew :app:assembleRelease --no-daemon --build-cache)
          apk=android/app/build/outputs/apk/release/app-release.apk
          test "$(unzip -p "$apk" assets/fingerprint)" = "$RUNTIME"
          test "$(bun x --no-install expo-updates runtimeversion:resolve --platform android --workflow managed | jq -er .runtimeVersion)" = "$RUNTIME"
          mkdir -p ../../dist/release
          cp "$apk" ../../dist/release/android.apk
          jq --arg sha "$(sha256sum "$apk" | cut -d' ' -f1)" '. + {sha256: $sha, action: "build"}' <<< "$MANIFEST" > ../../dist/release/android.json
      - &publish
        name: Publish
        if: github.job == 'ios' || (github.job == 'web' && steps.platforms.outputs.android == 'true') || steps.platforms.outputs.selected == 'true'
        shell: bash
        run: |
          check_source() { test "$(gh api "repos/$GH_REPO/$SOURCE_PATH" --jq 'if has("head") then (if .state == "open" then .head.sha else "closed" end) else .object.sha end')" = "$SOURCE"; }
          check_source
          for file in dist/release/*; do test -f "$file"; test -s "$file"; done
          case "$PLATFORM" in
            android) test -s dist/release/android.apk; test -s dist/release/android.json ;;
            ios) test -s dist/release/ios.ipa; test -s dist/release/ios.json ;;
            linux) compgen -G 'dist/release/*.deb' > /dev/null; compgen -G 'dist/release/*.rpm' > /dev/null ;;
            windows) compgen -G 'dist/release/*.exe' > /dev/null; compgen -G 'dist/release/*.nupkg' > /dev/null; test -s dist/release/RELEASES ;;
            macos) compgen -G 'dist/release/*.dmg' > /dev/null ;;
            *) exit 1 ;;
          esac
          TAG="$RELEASE_PREFIX-$CHANNEL-$PLATFORM"
          if [[ '${{ github.event_name }}' == push ]]; then TAG+="-${{ github.run_id }}-${{ github.run_attempt }}"; fi
          printf "Platform: %s\nSource: %s\n" "$PLATFORM" "$SOURCE" > notes.md
          if [[ -f dist/release/macos.txt ]]; then cat dist/release/macos.txt >> notes.md; fi
          if [[ -f dist/release/android.json ]]; then echo "<!-- android $(jq -c . dist/release/android.json) -->" >> notes.md; fi
          if [[ -f dist/release/ios.json ]]; then echo "<!-- ios $(jq -c . dist/release/ios.json) -->" >> notes.md; fi
          if gh release view "$TAG" --json assets > previous.json; then
            check_source
            gh release upload "$TAG" dist/release/* --clobber
            while IFS= read -r asset; do
              asset=${asset%$'\r'}
              if [[ ! -f "dist/release/$asset" ]]; then check_source; gh release delete-asset "$TAG" "$asset" --yes; fi
            done < <(jq -r '.assets[].name' previous.json)
            check_source
            if [[ '${{ github.event_name }}' == pull_request ]]; then gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$SOURCE" -F force=true > /dev/null; fi
          else
            gh release create "$TAG" dist/release/* --draft --target "$SOURCE" --title "$CHANNEL / $PLATFORM" --notes-file notes.md --prerelease=${{ github.event_name == 'pull_request' }}
          fi
          check_source
          gh release edit "$TAG" --title "$CHANNEL / $PLATFORM" --notes-file notes.md --draft=false --prerelease=${{ github.event_name == 'pull_request' }} --latest=false
          echo "Release: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  ios:
    name: iOS
    needs: web
    if: needs.web.outputs.ios_build == 'true' && vars.IOS_BUILD_ENABLED == 'true'
    permissions: *release-permissions
    runs-on: *macos-runner
    timeout-minutes: 60
    env:
      PLATFORM: ios
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EXPO_SLUG: ${{ vars.EXPO_SLUG }}
      EXPO_NO_DOTENV: '1'
      CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      EXPO_PUBLIC_CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      EXPO_PUBLIC_CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      MANIFEST: ${{ needs.web.outputs.ios_manifest }}
    steps:
      - *checkout
      - *platforms
      - *node
      - *bun
      - *cache
      - *install
      - *expo
      - name: Pods
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: pods-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: pods-${{ runner.arch }}-
      - name: Build
        working-directory: apps/mobile
        run: |
          test "$(gh api "repos/$GH_REPO/$SOURCE_PATH" --jq 'if has("head") then (if .state == "open" then .head.sha else "closed" end) else .object.sha end')" = "$SOURCE"
          mkdir -p ../../dist/release
          bun x "$EAS_CLI" build --platform ios --profile "ios-$EAS_ENVIRONMENT" --local --non-interactive --output ../../dist/release/ios.ipa
      - name: Verify
        run: |
          unzip -q dist/release/ios.ipa -d "$RUNNER_TEMP/ipa"
          apps=("$RUNNER_TEMP/ipa/Payload/"*.app)
          test "${#apps[@]}" -eq 1
          app=${apps[0]}
          codesign --verify --deep --strict "$app"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Info.plist")" = "$(jq -r .applicationId <<< "$MANIFEST")"
          test "$(plutil -extract EXUpdatesRuntimeVersion raw -o - "$app/Expo.plist")" = "$(jq -r .runtimeVersion <<< "$MANIFEST")"
          test "$(plutil -extract EXUpdatesRequestHeaders.expo-channel-name raw -o - "$app/Expo.plist")" = "$CHANNEL"
          security cms -D -i "$app/embedded.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          expires=$(python3 -c 'import datetime,plistlib,sys; p=plistlib.load(open(sys.argv[1],"rb")); expiry=p["ExpirationDate"].replace(tzinfo=datetime.timezone.utc); assert p.get("ProvisionedDevices") and not p["Entitlements"].get("get-task-allow",False) and expiry>datetime.datetime.now(datetime.timezone.utc); print(expiry.isoformat())' "$RUNNER_TEMP/profile.plist")
          jq --arg sha "$(shasum -a 256 dist/release/ios.ipa | cut -d' ' -f1)" --arg expires "$expires" '. + {sha256: $sha, expiresAt: $expires}' <<< "$MANIFEST" > dist/release/ios.json
      - *publish

  desktop:
    permissions: *release-permissions
    name: ${{ matrix.platform }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, runner: *linux-runner}
          - {platform: windows, runner: *windows-runner}
          - {platform: macos, runner: *macos-runner}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PLATFORM: ${{ matrix.platform }}
      DISPOSABL_DESKTOP_PLATFORM: ${{ matrix.platform }}
      MACOS_NOTARIZE: ${{ secrets.MACOS_CERTIFICATES_P12_PRODUCTION != '' && secrets.MACOS_CERTIFICATES_PASSWORD_PRODUCTION != '' && secrets.MACOS_APPLE_API_KEY_P8_PRODUCTION != '' && secrets.MACOS_APPLE_API_KEY_ID_PRODUCTION != '' && secrets.MACOS_APPLE_API_ISSUER_PRODUCTION != '' }}
      electron_config_cache: ${{ github.workspace }}/.cache/electron
    steps:
      - *checkout
      - *platforms
      - *node
      - *bun
      - *cache
      - *install
      - name: Electron
        if: steps.platforms.outputs.selected == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Packages
        if: steps.platforms.outputs.selected == 'true' && matrix.platform == 'linux'
        run: command -v fakeroot && command -v rpmbuild && command -v dpkg-deb || { sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm; }
      # Apple credentials are optional for both previews and production.
      - name: Sign
        if: steps.platforms.outputs.selected == 'true' && matrix.platform == 'macos' && env.MACOS_NOTARIZE == 'true'
        uses: apple-actions/import-codesign-certs@v7.2.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATES_P12_PRODUCTION }}
          p12-password: ${{ secrets.MACOS_CERTIFICATES_PASSWORD_PRODUCTION }}
      - name: Notary
        if: steps.platforms.outputs.selected == 'true' && matrix.platform == 'macos' && env.MACOS_NOTARIZE == 'true'
        env:
          API_KEY_P8: ${{ secrets.MACOS_APPLE_API_KEY_P8_PRODUCTION }}
          API_KEY_ID: ${{ secrets.MACOS_APPLE_API_KEY_ID_PRODUCTION }}
          API_ISSUER: ${{ secrets.MACOS_APPLE_API_ISSUER_PRODUCTION }}
        run: |
          : "${API_KEY_P8:?Configure MACOS_APPLE_API_KEY_P8_PRODUCTION}" "${API_KEY_ID:?Configure MACOS_APPLE_API_KEY_ID_PRODUCTION}" "${API_ISSUER:?Configure MACOS_APPLE_API_ISSUER_PRODUCTION}"
          umask 077
          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          printf 'APPLE_API_KEY=%s\nAPPLE_API_KEY_ID=%s\nAPPLE_API_ISSUER=%s\n' "$RUNNER_TEMP/notary.p8" "$API_KEY_ID" "$API_ISSUER" >> "$GITHUB_ENV"
      - name: Build
        if: steps.platforms.outputs.selected == 'true'
        run: bun run --cwd apps/desktop preview
      - name: Verify
        if: steps.platforms.outputs.selected == 'true' && matrix.platform == 'macos'
        run: |
          images=(dist/release/*.dmg)
          test "${#images[@]}" -eq 1 && test -s "${images[0]}"
          mkdir -p "$RUNNER_TEMP/macos-verify"
          hdiutil attach "${images[0]}" -readonly -nobrowse -mountpoint "$RUNNER_TEMP/macos-verify"
          trap 'hdiutil detach "$RUNNER_TEMP/macos-verify"' EXIT
          apps=("$RUNNER_TEMP/macos-verify/"*.app)
          test "${#apps[@]}" -eq 1 && test -d "${apps[0]}"
          codesign --verify --deep --strict "${apps[0]}"
          if [[ "$MACOS_NOTARIZE" == true ]]; then
            spctl --assess --type execute --verbose "${apps[0]}"
            xcrun stapler validate "${apps[0]}"
            echo 'macOS: Apple Silicon, Developer ID signed and notarized.' > dist/release/macos.txt
          else
            echo 'macOS: Apple Silicon, ad hoc signed and NOT notarized. If blocked, use System Settings > Privacy & Security > Open Anyway. https://support.apple.com/102445' > dist/release/macos.txt
          fi
          cat dist/release/macos.txt >> "$GITHUB_STEP_SUMMARY"
      - *publish
      - name: Clean
        if: always() && matrix.platform == 'macos'
        run: rm -f "$RUNNER_TEMP/notary.p8"
