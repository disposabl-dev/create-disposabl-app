name: Boat benchmark
on:
  push:
    branches: [boatbench-20261101-d30ee8ce]
permissions:
  contents: read
jobs:
  web:
    runs-on: boat
    defaults: {run: {working-directory: benchmark-app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.4.4'}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: boatbench-d30ee8ce-bun-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('benchmark-app/bun.lock') }}
      - run: nproc; uname -a; time bun install --frozen-lockfile
      - run: time bun run lint
      - run: time bun run typecheck
      - run: time bun run build --filter=!desktop
        env: {VITE_CONVEX_URL: 'https://ci.invalid', VITE_CONVEX_SITE_URL: 'https://ci.invalid'}
  desktop:
    needs: web
    runs-on: boat-small
    defaults: {run: {working-directory: benchmark-app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.4.4'}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/.cache/electron-builder
          key: boatbench-d30ee8ce-desktop-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('benchmark-app/bun.lock') }}
      - run: nproc; uname -a; sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm
      - run: time bun install --frozen-lockfile
      - run: time bun run --cwd apps/desktop preview && find dist/release -type f -exec ls -lh {} +
        env: {DISPOSABL_DESKTOP_PLATFORM: linux, DISPOSABL_RELEASE_VERSION: '1.0.42'}
  android:
    needs: web
    runs-on: boat
    defaults: {run: {working-directory: benchmark-app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: '1.4.4'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: boatbench-d30ee8ce-gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('benchmark-app/bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: boatbench-d30ee8ce-bun-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('benchmark-app/bun.lock') }}
      - run: nproc; uname -a; time bun install --frozen-lockfile
      - run: time bun run --cwd apps/mobile build:android && find . -name '*.apk' -exec ls -lh {} +
        env: {EXPO_PROJECT_ID: '74446a59-bd68-4e6b-823f-618c688178fe', EXPO_OWNER: vivek-yast, EXPO_SLUG: disposabl-starter-android, DISPOSABL_ANDROID_CHANNEL: ci-benchmark-boat}
