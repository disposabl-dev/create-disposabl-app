name: Pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel obsolete PRs; finish active production releases and keep only the latest pending run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CHANNEL: &channel ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
  DISPOSABL_MOBILE_CHANNEL: *channel
  EAS_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'preview' }}
  EAS_CLI: eas-cli@27.2.0
  BUN_VERSION: &bun-version "1.4.5"
  NODE_VERSION: &node-version "24"
  LINUX_RUNNER: &linux-runner ubuntu-24.04
  RELEASE_PREFIX: app
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
  DISPOSABL_ANDROID_VERSION_CODE: ${{ github.run_number }}
  DISPOSABL_IOS_BUILD_NUMBER: ${{ github.run_number }}
  # Build jobs only read this repository. Keep installation tokens in publishing jobs.
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_PATH: ${{ github.event_name == 'pull_request' && format('pulls/{0}', github.event.number) || 'git/ref/heads/main' }}
  DISPOSABL_RELEASE_VERSION: 1.0.${{ github.run_number }}
jobs:
  changes:
    name: Select work
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: *linux-runner
    timeout-minutes: 3
    outputs:
      linux_runner: ${{ steps.platforms.outputs.linux_runner }}
      android_runner: ${{ steps.platforms.outputs.android_runner }}
      macos_runner: ${{ steps.platforms.outputs.macos_runner }}
      changed: ${{ steps.platforms.outputs.changed }}
      android: ${{ steps.platforms.outputs.android }}
      ios: ${{ steps.platforms.outputs.ios }}
      expo_connected: ${{ steps.platforms.outputs.expo_connected }}
      expo_setup: ${{ steps.platforms.outputs.expo_setup }}
      desktop: ${{ steps.platforms.outputs.desktop }}
      packages: ${{ steps.platforms.outputs.packages }}
    steps:
      - &checkout
        uses: actions/checkout@v6
        with: { ref: "${{ env.SOURCE }}", persist-credentials: false }
      - name: Select affected platforms
        shell: bash
        id: platforms
        env:
          PR: ${{ github.event.number }}
          EXPO_CONNECTED: ${{ secrets.EXPO_TOKEN != '' }}
          EXPO_PROJECT_CONFIGURED: ${{ secrets.EXPO_PROJECT_ID != '' || vars.EXPO_PROJECT_ID != '' }}
          IOS_BUILDS_ENABLED: ${{ vars.IOS_BUILDS_ENABLED != 'false' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/platforms.sh"
  product-checks:
    if: github.repository == 'disposabl-dev/create-disposabl-app' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    uses: ./.github/workflows/product-checks.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
  web:
    name: Web
    needs: [changes, product-checks]
    # Fork code must not run in a job with deployment credentials.
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.product-checks.result == 'success' && (needs.changes.outputs.changed == 'true' || (github.event_name == 'push' && github.repository == 'disposabl-dev/create-disposabl-app'))
    permissions: &release-permissions
      contents: read
      pull-requests: read
      id-token: write
    timeout-minutes: 10
    runs-on: ${{ needs.changes.outputs.linux_runner }}
    outputs:
      desktop: ${{ needs.changes.outputs.desktop }}
      ios: ${{ needs.changes.outputs.ios }}
      packages: ${{ needs.changes.outputs.packages }}
      convex_url: ${{ steps.deploy.outputs.CONVEX_URL }}
      convex_site_url: ${{ steps.deploy.outputs.CONVEX_SITE_URL }}
      public_site_url: ${{ steps.deploy.outputs.PUBLIC_SITE_URL }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - *checkout
      - name: Check deployment configuration
        env:
          DEPLOY_KEY_PRESENT: ${{ secrets[github.event_name == 'push' && 'CONVEX_DEPLOY_KEY' || 'CONVEX_DEPLOY_KEY_PREVIEW'] != '' }}
        run: |
          if [[ "$DEPLOY_KEY_PRESENT" != true ]]; then
            echo '::error::Configure the Convex deployment key for this release channel.'
            exit 1
          fi
      - &node
        uses: actions/setup-node@v6
        with: { node-version: *node-version, package-manager-cache: false }
      - &bun
        uses: oven-sh/setup-bun@v2
        with: { bun-version: *bun-version }
      - name: Check source formatting
        if: github.repository != 'disposabl-dev/create-disposabl-app'
        run: bun fmt --check
      - &cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ github.job == 'desktop' && 'desktop-' || (github.job == 'android' || startsWith(github.job, 'ios-')) && 'mobile-' || '' }}${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ github.job == 'desktop' && 'desktop-' || (github.job == 'android' || startsWith(github.job, 'ios-')) && 'mobile-' || '' }}${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Restore task cache
        if: github.repository != 'disposabl-dev/create-disposabl-app'
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}-${{ env.SOURCE }}
          restore-keys: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}-
      - &install
        run: bun install --frozen-lockfile ${{ (github.job == 'android' || startsWith(github.job, 'ios-')) && '--filter @disposabl/mobile' || '' }}
      - name: Report build start
        run: |
          node .github/scripts/disposabl.mjs report web,api,mcp building
          if [[ -z "$EXPO_TOKEN" ]]; then node .github/scripts/disposabl.mjs report android blocked 'Connect Expo before building Android.'; fi
          if [[ '${{ github.event_name }}' == pull_request ]]; then node .github/scripts/disposabl.mjs report cli,typescript-sdk blocked 'Packages publish after merge to main.'; fi
      - name: Check
        if: github.repository != 'disposabl-dev/create-disposabl-app'
        run: |
          bun run generate
          bun run --parallel check:source test:ci
      - name: Generate checked release inputs
        if: github.repository == 'disposabl-dev/create-disposabl-app'
        run: bun run generate
      - name: Build selected clients
        run: |
          packages=()
          for package in cli sdk; do
            if [[ -f "packages/$package/package.json" ]]; then packages+=(--filter "./packages/$package"); fi
          done
          if (( ${#packages[@]} )); then bun x --no-install turbo run build "${packages[@]}"; fi
      - name: Deploy
        id: deploy
        timeout-minutes: 10
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets[github.event_name == 'push' && 'CONVEX_DEPLOY_KEY' || 'CONVEX_DEPLOY_KEY_PREVIEW'] }}
        run: bash .github/scripts/web.sh deploy
      - name: Report web result
        if: always()
        run: node .github/scripts/disposabl.mjs report web,api,mcp ${{ steps.deploy.outcome == 'success' && 'ready' || 'failed' }}
  expo-project:
    name: Initialize Expo project
    needs: [changes, web]
    if: needs.changes.outputs.expo_setup == 'true'
    runs-on: ${{ needs.changes.outputs.linux_runner }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      id: ${{ steps.project.outputs.project_id }}
      owner: ${{ steps.project.outputs.owner }}
      slug: ${{ steps.project.outputs.slug }}
    steps:
      - *checkout
      - *node
      - *bun
      - name: Create or link the Expo project once
        id: project
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_OWNER: ${{ secrets.EXPO_OWNER || vars.EXPO_OWNER }}
          EXPO_NO_TELEMETRY: "1"
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-project
  android:
    name: Android
    needs: [changes, web, expo-project]
    if: always() && !cancelled() && needs.web.result == 'success' && (needs.expo-project.result == 'success' || needs.expo-project.result == 'skipped') && needs.changes.outputs.android == 'true'
    permissions: *release-permissions
    runs-on: ${{ needs.changes.outputs.android_runner }}
    timeout-minutes: 30
    outputs:
      release: ${{ steps.artifacts.outcome == 'success' }}
      built: ${{ steps.build.outcome == 'success' }}
      expo_project_id: ${{ needs.expo-project.outputs.id }}
      expo_owner: ${{ needs.expo-project.outputs.owner }}
      expo_slug: ${{ needs.expo-project.outputs.slug }}
    env:
      PLATFORM: android
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: &expo_project_id ${{ secrets.EXPO_PROJECT_ID || vars.EXPO_PROJECT_ID || needs.expo-project.outputs.id }}
      EXPO_OWNER: &expo_owner ${{ secrets.EXPO_OWNER || vars.EXPO_OWNER || needs.expo-project.outputs.owner }}
      EXPO_SLUG: &expo_slug ${{ secrets.EXPO_SLUG || vars.EXPO_SLUG || needs.expo-project.outputs.slug }}
      EXPO_NO_DOTENV: "1"
      CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      EXPO_PUBLIC_CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      PUBLIC_SITE_URL: ${{ needs.web.outputs.public_site_url }}
      EXPO_PUBLIC_CONVEX_SITE_URL: ${{ needs.web.outputs.public_site_url }}
      ANDROID_PLAY_SUBMIT: ${{ vars.ANDROID_PLAY_SUBMIT }}
    steps:
      - *checkout
      - *node
      - *bun
      - *cache
      - *install
      - name: Report mobile build
        run: node .github/scripts/disposabl.mjs report "$PLATFORM" building
      - name: Allocate product Android version
        id: android-version
        if: github.event_name == 'push' && github.repository == 'disposabl-dev/create-disposabl-app'
        run: |
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_NUMBER" -le 20999989 ]] || { echo 'Invalid pipeline run number' >&2; exit 1; }
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]?$ ]] || { echo 'Invalid pipeline attempt' >&2; exit 1; }
          version=$((1000 + 100 * GITHUB_RUN_NUMBER + GITHUB_RUN_ATTEMPT))
          echo "DISPOSABL_ANDROID_VERSION_CODE=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Expo
        timeout-minutes: 2
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-env
      - name: Channel
        timeout-minutes: 2
        if: github.event_name != 'push' || github.repository != 'disposabl-dev/create-disposabl-app'
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-channel
      - name: Java
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Fingerprint
        timeout-minutes: 2
        id: fingerprint
        env:
          DISPOSABL_ANDROID_SIGNING: ${{ github.event_name == 'push' && secrets.DISPOSABL_ANDROID_SIGNING || '' }}
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_PASSWORD || '' }}
          UPDATE_POLICY: ${{ github.event_name == 'push' && github.repository == 'disposabl-dev/create-disposabl-app' && 'expo' || '' }}
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-fingerprint
      - name: Restore Expo transform cache
        id: metro-cache
        if: steps.fingerprint.outcome == 'success'
        uses: actions/cache@v4
        with: &metro-cache
          path: ${{ runner.temp }}/expo-metro-restore
          key: expo-metro-v1-${{ github.job == 'android' && 'android' || 'ios' }}-${{ runner.os }}-${{ runner.arch }}-${{ env.NODE_VERSION }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock', 'package.json', 'apps/mobile/package.json', 'apps/mobile/*config.*', 'patches/**') }}
      - &metro-paths
        name: Set Expo transform cache paths
        if: steps.metro-cache.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/expo-metro-restore" "$RUNNER_TEMP/expo-metro-output"
          printf 'EXPO_METRO_CACHE_RESTORE_DIR=%s\nEXPO_METRO_CACHE_OUTPUT_DIR=%s\n' \
            "$RUNNER_TEMP/expo-metro-restore" "$RUNNER_TEMP/expo-metro-output" >> "$GITHUB_ENV"
      - name: Update
        id: ota
        if: steps.fingerprint.outputs.build == 'false' && !(github.event_name == 'push' && github.repository == 'disposabl-dev/create-disposabl-app')
        env:
          TAG: ${{ steps.fingerprint.outputs.tag }}
          SHA: ${{ steps.fingerprint.outputs.sha }}
          RUNTIME: ${{ steps.fingerprint.outputs.runtime }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-update
      - &metro-stage
        name: Save current Expo transforms on a cache miss
        if: steps.ota.outcome == 'success' && steps.metro-cache.outcome == 'success' && steps.metro-cache.outputs.cache-hit != 'true'
        run: &metro-stage-command |
          if [[ -n "$(find "$EXPO_METRO_CACHE_OUTPUT_DIR" -type f -print -quit)" ]] &&
            rmdir "$EXPO_METRO_CACHE_RESTORE_DIR"; then
            mv "$EXPO_METRO_CACHE_OUTPUT_DIR" "$EXPO_METRO_CACHE_RESTORE_DIR"
          fi
      - name: Prepare Android disk space
        if: steps.fingerprint.outputs.build == 'true' || (github.event_name == 'push' && github.repository == 'disposabl-dev/create-disposabl-app')
        id: native
        run: bash .github/scripts/android-runner.sh prepare
      - name: Prepare the installed Android SDK
        if: steps.native.outcome == 'success'
        id: installed-sdk
        run: bash .github/scripts/android-runner.sh sdk
      - name: SDK
        if: steps.native.outcome == 'success' && steps.installed-sdk.outputs.ready != 'true'
        uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: Gradle
        if: steps.native.outcome == 'success'
        uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: "${{ github.event_name != 'push' }}" }
      - name: Restore native compiler cache
        if: steps.native.outcome == 'success'
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: android-ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'apps/mobile/app.json', 'apps/mobile/scripts/**') }}-${{ env.SOURCE }}
          restore-keys: android-ccache-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'apps/mobile/app.json', 'apps/mobile/scripts/**') }}-
      - name: Install native compiler cache
        if: steps.native.outcome == 'success'
        id: native-compiler
        run: |
          if ! command -v ccache >/dev/null; then
            if ! sudo apt-get update -qq || ! sudo apt-get install -y ccache; then
              echo '::warning::Native compiler cache is unavailable.'
              exit 0
            fi
          fi
          printf 'CCACHE_DIR=%s\nCCACHE_BASEDIR=%s\nCCACHE_MAXSIZE=512M\nCCACHE_COMPILERCHECK=content\nCMAKE_C_COMPILER_LAUNCHER=ccache\nCMAKE_CXX_COMPILER_LAUNCHER=ccache\n' "$RUNNER_TEMP/ccache" "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo 'enabled=true' >> "$GITHUB_OUTPUT"
      - name: Select Android bundle validation
        if: steps.native.outcome == 'success'
        id: bundletool-needed
        env:
          SIGNING_BUNDLE: ${{ github.event_name == 'push' && secrets.DISPOSABL_ANDROID_SIGNING || '' }}
          SIGNING_STORE: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          SIGNING_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          SIGNING_ALIAS: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_ALIAS || '' }}
          SIGNING_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [[ -n "$SIGNING_BUNDLE$SIGNING_STORE$SIGNING_PASSWORD$SIGNING_ALIAS$SIGNING_KEY_PASSWORD" ]]; then echo 'needed=true' >> "$GITHUB_OUTPUT"; fi
      - name: Download verified bundletool
        if: steps.bundletool-needed.outputs.needed == 'true'
        run: |
          curl --fail --location --silent --show-error --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check --status
      - name: Build
        id: build
        if: steps.native.outcome == 'success'
        working-directory: apps/mobile
        env:
          DISPOSABL_ANDROID_SIGNING: ${{ github.event_name == 'push' && secrets.DISPOSABL_ANDROID_SIGNING || '' }}
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_PASSWORD || '' }}
          RUNTIME: ${{ steps.fingerprint.outputs.runtime }}
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
          UPDATE_POLICY: ${{ github.event_name == 'push' && github.repository == 'disposabl-dev/create-disposabl-app' && 'expo' || '' }}
          DISPOSABL_ANDROID_VERSION_CODE: ${{ steps.android-version.outputs.version || github.run_number }}
          DISPOSABL_ANDROID_CHANNEL: *channel
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" android-build
      - name: Save current Expo transforms from the native build
        if: steps.build.outcome == 'success' && steps.metro-cache.outcome == 'success' && steps.metro-cache.outputs.cache-hit != 'true'
        run: *metro-stage-command
      - &publish
        name: Publish
        if: github.job == 'desktop' || hashFiles('dist/release/android.json') != ''
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/release.sh" verify-artifacts
      - name: Upload release artifacts
        id: artifacts
        if: hashFiles('dist/release/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.PLATFORM }}
          path: dist/release/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Save native compiler cache
        # GitHub scopes PR caches to their own merge ref. Save only the first
        # compatible entry in that scope and reuse it for subsequent PR commits.
        if: >-
          steps.build.outcome == 'success' && steps.native-compiler.outputs.enabled == 'true' &&
          ((github.event_name == 'push' && steps.native-cache.outputs.cache-hit != 'true') ||
           (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
            steps.native-cache.outputs.cache-matched-key == ''))
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
  android-submit:
    name: Android Play submission
    needs: android
    if: github.event_name == 'push' && vars.ANDROID_PLAY_SUBMIT == 'true' && needs.android.outputs.built == 'true' && needs.android.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID || vars.EXPO_PROJECT_ID || needs.android.outputs.expo_project_id }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER || vars.EXPO_OWNER || needs.android.outputs.expo_owner }}
      EXPO_SLUG: ${{ secrets.EXPO_SLUG || vars.EXPO_SLUG || needs.android.outputs.expo_slug }}
      EXPO_NO_DOTENV: "1"
    steps:
      - *checkout
      - *node
      - *bun
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist/release
      - name: Verify product Play identity
        if: github.repository == 'disposabl-dev/create-disposabl-app'
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          bash .github/scripts/play-bundle.sh verify-submission-source
          test "$(jq -er .applicationId dist/release/android.json)" = com.yastai.disposabl
          keytool -printcert -jarfile dist/release/android.aab | grep -F 'SHA1: 9E:8B:A8:A6:CC:91:07:8A:46:4F:BE:F2:52:86:0B:C8:FE:FB:18:B2' >/dev/null
          node .github/scripts/android-signatures.mjs dist/release/android.aab 92ad2c5b65aad964b622a4b4fede94b40a31dcae0eb537b9201ea464689a9fb9 >/dev/null
      - name: Submit Android bundle
        working-directory: apps/mobile
        env:
          ANDROID_PLAY_SERVICE_ACCOUNT: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT }}
          ANDROID_PLAY_TRACK: ${{ vars.ANDROID_PLAY_TRACK }}
          ANDROID_PLAY_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_PLAY_UPLOAD_CERT_SHA256 }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" android-submit
  android-failure:
    name: Report Android failure
    needs: [changes, expo-project, android]
    if: always() && (needs.android.result == 'failure' || needs.android.result == 'cancelled' || (needs.changes.outputs.android == 'true' && needs.expo-project.result == 'failure'))
    permissions:
      contents: read
      id-token: write
    runs-on: *linux-runner
    timeout-minutes: 5
    steps:
      - *checkout
      - *node
      - env:
          DETAIL: ${{ needs.expo-project.result == 'failure' && 'Expo project setup failed. Check the workflow log.' || 'Android build failed or was cancelled. Check the workflow log.' }}
        run: node .github/scripts/disposabl.mjs report android failed "$DETAIL"
  ios-preview:
    name: iOS simulator preview
    needs: [changes, web, expo-project]
    if: always() && !cancelled() && needs.web.result == 'success' && (needs.expo-project.result == 'success' || needs.expo-project.result == 'skipped') && github.event_name == 'pull_request' && needs.web.outputs.ios == 'true'
    permissions: *release-permissions
    runs-on: ${{ needs.changes.outputs.macos_runner }}
    # Cold simulator builds compile native dependencies for both architectures.
    timeout-minutes: 60
    env: &ios-preview-env
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      EXPO_PUBLIC_CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      PUBLIC_SITE_URL: ${{ needs.web.outputs.public_site_url }}
      EXPO_PUBLIC_CONVEX_SITE_URL: ${{ needs.web.outputs.public_site_url }}
      EXPO_PROJECT_ID: *expo_project_id
      EXPO_OWNER: *expo_owner
      EXPO_SLUG: *expo_slug
      EXPO_NO_DOTENV: "1"
    steps:
      - *checkout
      - *node
      - *bun
      - *cache
      - *install
      - name: Report build
        run: node .github/scripts/disposabl.mjs report ios building
      - name: Load Expo environment
        timeout-minutes: 2
        if: env.EXPO_TOKEN != ''
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-env
      - name: Xcode toolchain
        id: xcode
        run: |
          version=$(xcodebuild -version)
          printf '%s\n' "$version"
          xcrun swift --version
          if [[ "$version" =~ ^Xcode[[:space:]]([0-9]+) && "${BASH_REMATCH[1]}" -ge 26 ]]; then
            id=$({ printf '%s\n' "$version" "$GITHUB_WORKSPACE" "$RUNNER_TEMP"; xcrun --sdk iphonesimulator --show-sdk-build-version; } | shasum -a 256 | cut -d' ' -f1)
            printf 'cas_key=%s\n' "$id" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore CocoaPods downloads and specifications
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos/trunk
          key: cocoapods-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Restore Xcode compilation cache
        if: steps.xcode.outputs.cas_key != ''
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ios-cas
          key: ios-simulator-cas-v1-${{ runner.arch }}-${{ steps.xcode.outputs.cas_key }}-${{ hashFiles('bun.lock', 'apps/mobile/app.*', 'apps/mobile/package.json', 'apps/mobile/plugins/**', 'patches/**') }}
      - name: Enable simulator compiler cache
        id: simulator-cache
        if: steps.xcode.outputs.cas_key == ''
        timeout-minutes: 2
        continue-on-error: true
        run: bash .github/scripts/apple.sh prepare-cache
      - name: Restore simulator compiler cache
        if: steps.simulator-cache.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ios-ccache
          key: ios-simulator-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ env.SOURCE }}
          restore-keys: ios-simulator-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-
      - name: Build simulator archive
        env:
          XCODE_COMPILATION_CACHE_DIR: ${{ steps.xcode.outputs.cas_key != '' && format('{0}/ios-cas', runner.temp) || '' }}
          CCACHE_DIR: ${{ runner.temp }}/ios-ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 512M
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" simulator
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: dist/apple/ios-simulator.zip
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Report simulator archive
        run: echo 'iOS simulator archive is available in this workflow run’s artifacts; it is not a device or TestFlight build.' >> "$GITHUB_STEP_SUMMARY"
  ios-preview-update:
    name: iOS preview update
    needs: [changes, web, expo-project]
    if: always() && !cancelled() && needs.web.result == 'success' && (needs.expo-project.result == 'success' || needs.expo-project.result == 'skipped') && github.event_name == 'pull_request' && needs.web.outputs.ios == 'true' && needs.changes.outputs.expo_connected == 'true'
    permissions:
      contents: read
      pull-requests: read
    runs-on: ${{ needs.changes.outputs.linux_runner }}
    timeout-minutes: 5
    env: *ios-preview-env
    steps:
      - *checkout
      - *node
      - *bun
      - *cache
      - *install
      - name: Load Expo project and environment
        timeout-minutes: 2
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-env
      - name: Verify update channel
        timeout-minutes: 2
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-channel
      - name: Restore Expo transform cache
        id: metro-cache
        uses: actions/cache@v4
        with: *metro-cache
      - *metro-paths
      - name: Publish the preview update
        id: ota
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" ota
      - *metro-stage
  ios-preview-report:
    name: Report iOS preview
    needs: [changes, web, ios-preview, ios-preview-update]
    if: always() && !cancelled() && github.event_name == 'pull_request' && needs.web.result == 'success' && needs.web.outputs.ios == 'true'
    permissions: *release-permissions
    runs-on: ${{ needs.changes.outputs.linux_runner }}
    timeout-minutes: 3
    steps:
      - *checkout
      - *node
      - name: Report combined iOS preview result
        env:
          ARCHIVE: ${{ needs.ios-preview.result }}
          UPDATE: ${{ needs.ios-preview-update.result }}
          EXPO_CONNECTED: ${{ needs.changes.outputs.expo_connected }}
        run: |
          if [[ "$ARCHIVE" == success && ( "$EXPO_CONNECTED" != true || "$UPDATE" == success ) ]]; then
            node .github/scripts/disposabl.mjs report ios ready 'Simulator archive available in workflow artifacts.'
          else
            node .github/scripts/disposabl.mjs report ios failed 'The iOS simulator archive or Expo preview update failed. Check the workflow log.'
          fi
  ios-production:
    name: iOS production and TestFlight
    needs: [changes, web, expo-project]
    if: always() && !cancelled() && needs.web.result == 'success' && (needs.expo-project.result == 'success' || needs.expo-project.result == 'skipped') && github.event_name == 'push' && needs.web.outputs.ios == 'true'
    permissions: *release-permissions
    runs-on: ${{ github.repository == 'disposabl-dev/create-disposabl-app' && 'xcode-27' || needs.changes.outputs.linux_runner }}
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: *expo_project_id
      EXPO_OWNER: *expo_owner
      EXPO_SLUG: *expo_slug
      EXPO_NO_DOTENV: "1"
      ASC_APP_ID: ${{ secrets.ASC_APP_ID || vars.ASC_APP_ID }}
      CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      EXPO_PUBLIC_CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      PUBLIC_SITE_URL: ${{ needs.web.outputs.public_site_url }}
      EXPO_PUBLIC_CONVEX_SITE_URL: ${{ needs.web.outputs.public_site_url }}
    steps:
      - *checkout
      - *node
      - *bun
      - *cache
      - *install
      - name: Check Expo connection
        id: apple-prerequisites
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" prerequisites
      - name: Load Expo environment
        timeout-minutes: 2
        if: steps.apple-prerequisites.outputs.ready == 'true'
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-env
      - name: Verify update channel
        timeout-minutes: 2
        if: steps.apple-prerequisites.outputs.ready == 'true'
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-channel
      - name: Select iOS update or native build
        timeout-minutes: 2
        id: ios-plan
        if: steps.apple-prerequisites.outputs.ready == 'true'
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" ota-plan
      - name: Restore TestFlight upload provenance
        id: ios-provenance
        if: github.repository == 'disposabl-dev/create-disposabl-app' && steps.apple-prerequisites.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ios-provenance/build.json
          key: ios-testflight-${{ env.ASC_APP_ID }}-${{ env.EXPO_PROJECT_ID }}-${{ steps.ios-plan.outputs.version }}-${{ steps.ios-plan.outputs.runtime }}
      - name: Check existing TestFlight upload
        id: ios-baseline
        if: github.repository == 'disposabl-dev/create-disposabl-app' && steps.ios-provenance.outputs.cache-hit == 'true'
        env:
          APP_VERSION: ${{ steps.ios-plan.outputs.version }}
          RUNTIME: ${{ steps.ios-plan.outputs.runtime }}
          IOS_IDENTIFIER: ${{ steps.ios-plan.outputs.identifier }}
        run: |
          build=$(jq -er --arg app "$ASC_APP_ID" --arg project "$EXPO_PROJECT_ID" --arg version "$APP_VERSION" --arg runtime "$RUNTIME" --arg identifier "$IOS_IDENTIFIER" 'select(.app == $app and .project == $project and .version == $version and .runtime == $runtime and .identifier == $identifier) | .build | select(test("^[0-9]+$"))' .ios-provenance/build.json)
          public=$(curl -fsS --max-time 15 "https://itunes.apple.com/lookup?id=$ASC_APP_ID" | jq -r --arg identifier "$IOS_IDENTIFIER" '.results[] | select(.bundleId == $identifier) | .version') || public=''
          if [[ "$public" == "$APP_VERSION" ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            node .github/scripts/disposabl.mjs report ios ready "iOS $APP_VERSION ($build) was uploaded to TestFlight. Public distribution is pending."
            echo '### Submit for Store Review' >> "$GITHUB_STEP_SUMMARY"
            printf 'After Apple processes the upload, run `bun run store:review ios %s %s` with the local App Store Connect key.\n' "$APP_VERSION" "$build" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enable production compiler cache
        id: production-cache
        if: github.repository == 'disposabl-dev/create-disposabl-app' && steps.apple-prerequisites.outputs.ready == 'true' && steps.ios-provenance.outputs.cache-hit != 'true'
        timeout-minutes: 2
        continue-on-error: true
        run: bash .github/scripts/apple.sh prepare-cache
      - name: Restore production compiler cache
        if: steps.production-cache.outputs.enabled == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ios-ccache
          key: ios-production-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ env.SOURCE }}
          restore-keys: ios-production-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-
      - name: Build product iOS and upload to TestFlight
        if: github.repository == 'disposabl-dev/create-disposabl-app' && steps.apple-prerequisites.outputs.ready == 'true' && steps.ios-provenance.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-ios
          CCACHE_DIR: ${{ runner.temp }}/ios-ccache
          CCACHE_BASEDIR: ${{ runner.temp }}/eas-ios
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 512M
          APP_VERSION: ${{ steps.ios-plan.outputs.version }}
          RUNTIME: ${{ steps.ios-plan.outputs.runtime }}
          IOS_IDENTIFIER: ${{ steps.ios-plan.outputs.identifier }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" production
      - name: Save TestFlight upload provenance
        if: github.repository == 'disposabl-dev/create-disposabl-app' && steps.apple-prerequisites.outputs.ready == 'true' && steps.ios-provenance.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ios-provenance/build.json
          key: ios-testflight-${{ env.ASC_APP_ID }}-${{ env.EXPO_PROJECT_ID }}-${{ steps.ios-plan.outputs.version }}-${{ steps.ios-plan.outputs.runtime }}
      - name: Restore Expo transform cache
        id: metro-cache
        if: steps.ios-plan.outputs.action == 'update' || steps.ios-baseline.outputs.available == 'true'
        uses: actions/cache@v4
        with: *metro-cache
      - *metro-paths
      - name: Publish compatible iOS production update
        id: ota
        if: steps.ios-plan.outputs.action == 'update' || steps.ios-baseline.outputs.available == 'true'
        working-directory: apps/mobile
        env:
          RUNTIME: ${{ steps.ios-plan.outputs.runtime }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" ota
      - *metro-stage
      - name: Build and submit to TestFlight
        if: github.repository != 'disposabl-dev/create-disposabl-app' && steps.ios-plan.outputs.action == 'build'
        working-directory: apps/mobile
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID || vars.ASC_APP_ID }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" production
      - name: Reconcile delivery of the compatible native build
        if: github.repository != 'disposabl-dev/create-disposabl-app' && steps.ios-plan.outputs.action == 'update'
        working-directory: apps/mobile
        env:
          BUILD_ID: ${{ steps.ios-plan.outputs.build_id }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID || vars.ASC_APP_ID }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" deliver
      - name: Report failure
        if: failure() || cancelled()
        run: node .github/scripts/disposabl.mjs report ios failed 'iOS update, native build or submission failed; check the workflow log.'
  desktop:
    needs: web
    permissions: *release-permissions
    name: ${{ matrix.platform }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.web.outputs.desktop != '[]' && needs.web.outputs.desktop != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.web.outputs.desktop) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PLATFORM: ${{ matrix.platform }}
      DISPOSABL_RELEASE_VERSION: 1.${{ github.run_number }}.${{ github.run_attempt }}
      DISPOSABL_DESKTOP_PLATFORM: ${{ matrix.platform }}
      DISPOSABL_DESKTOP_UPDATE_CHANNEL: production
      CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      electron_config_cache: ${{ github.workspace }}/.cache/electron
    steps:
      - *checkout
      - *node
      - name: Configure desktop update identity
        shell: bash
        run: |
          id=$(node -p "require('./disposabl.json').desktopId || ''")
          if [[ ! "$id" =~ ^[a-f0-9]{32}$ ]]; then echo 'Desktop identity missing; regenerate this app before its first installation.' >&2; exit 1; fi
          echo "DISPOSABL_DESKTOP_ID=$id" >> "$GITHUB_ENV"
          echo "DISPOSABL_DESKTOP_UPDATE_URL=${CONVEX_SITE_URL}/desktop/updates/$id" >> "$GITHUB_ENV"
      - *bun
      - *cache
      - run: bun install --frozen-lockfile --filter ./apps/desktop
      - name: Report desktop build
        run: node .github/scripts/disposabl.mjs report "$PLATFORM" building
      - name: Electron
        uses: actions/cache@v4
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/desktop/package.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-
      - name: Packages
        if: matrix.platform == 'linux'
        run: command -v fakeroot && command -v rpmbuild && command -v dpkg-deb || { sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm; }
      - name: Build
        if: matrix.platform != 'macos'
        shell: bash
        env:
          DPKG_DEB_COMPRESSOR_LEVEL: ${{ matrix.platform == 'linux' && '1' || '' }}
        run: |
          # Squirrel reads and rewrites the whole packaged app in this directory.
          if [[ "$RUNNER_OS" == Windows ]] && maker_temp=$(mktemp -d ../squirrel.XXXXXX); then
            trap 'rm -rf -- "$maker_temp"' EXIT
            export TEMP="$(cygpath -aw "$maker_temp")"
            export TMP="$TEMP" TMPDIR="$TEMP"
          fi
          bun run --cwd apps/desktop preview
      - name: Build macOS
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_SIGNING_CONFIG: ${{ secrets.MACOS_SIGNING_CONFIG }}
        run: bash .github/scripts/macos-release.sh
      - *publish
      - name: Publish desktop update feed
        if: matrix.platform == 'windows' || (matrix.platform == 'macos' && env.MACOS_NOTARIZE == 'true')
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$SOURCE"
          node apps/desktop/publish-update.mjs
      - name: Upload desktop release artifacts
        if: matrix.platform != 'macos' || env.MACOS_NOTARIZE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.PLATFORM }}
          path: dist/release/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Upload staged update feed
        if: matrix.platform != 'linux' && env.DISPOSABL_DESKTOP_UPDATE_URL != '' && (matrix.platform != 'macos' || env.MACOS_NOTARIZE == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: desktop-update-${{ env.PLATFORM }}
          path: dist/update/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Upload unsigned macOS artifact
        if: matrix.platform == 'macos' && env.MACOS_NOTARIZE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned
          path: |
            dist/release/*.dmg
            dist/release/*.zip
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Report macOS artifact
        if: matrix.platform == 'macos' && env.MACOS_NOTARIZE != 'true'
        run: |
          echo 'macOS DMG is ad-hoc signed, not Developer ID signed or notarized. Download it from this workflow run’s artifacts.' >> "$GITHUB_STEP_SUMMARY"
          node .github/scripts/disposabl.mjs report macos blocked 'Ad-hoc signed DMG available in workflow artifacts; Developer ID signing and notarization are not configured.'
      - name: Report desktop failure
        if: failure() || cancelled()
        run: node .github/scripts/disposabl.mjs report "$PLATFORM" failed
      - name: Clean up macOS signing
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: bash .github/scripts/macos-release.sh cleanup
  packages:
    name: Package / ${{ matrix.package }}
    needs: [changes, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.web.outputs.packages != '[]' && needs.web.outputs.packages != ''
    # npm OIDC trusted publishing requires a GitHub-hosted runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-${{ matrix.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.web.outputs.packages) }}
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, persist-credentials: false }
      - *node
      - *bun
      - *cache
      - *install
      - name: Disposabl GitHub App token
        run: node .github/scripts/disposabl.mjs token
      - name: Publish package if configured
        run: bash .github/scripts/release.sh package-release

  # The publisher executes scripts from main only; the authorizer verifies workflow_sha.
  publish:
    needs: [changes, web, android, desktop]
    if: always() && !cancelled() && needs.web.result == 'success' && ((needs.android.result == 'success' && needs.android.outputs.release == 'true') || needs.desktop.result == 'success')
    environment: publishing
    runs-on: ${{ needs.changes.outputs.linux_runner }}
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Disposabl installation token
        run: node .github/scripts/disposabl.mjs token
      - name: Select release source
        id: source
        run: bash .github/scripts/release.sh release-source
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.current == 'true'
        with:
          pattern: release-*
          path: artifacts
      - name: Publish verified build artifacts
        if: steps.source.outputs.current == 'true'
        run: bash .github/scripts/release.sh release-publish
