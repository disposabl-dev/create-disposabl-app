name: GitHub hosted cold and warm build benchmark

on:
  push:
    branches: [benchmark/github-hosted-build-speeds]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VITE_CONVEX_URL: https://ci.invalid
      VITE_CONVEX_SITE_URL: https://ci.invalid
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/cache@v4
        id: bun-cache
        with:
          path: ~/.bun/install/cache
          key: githubbench-nov1-web-${{ runner.os }}-${{ runner.arch }}-bun1.4.4-${{ hashFiles('benchmark-app/bun.lock') }}
      - name: Machine and queue timing
        run: |
          echo "Runner: $RUNNER_OS/$RUNNER_ARCH"
          nproc
          lscpu
          free -h
          cat /etc/os-release
          echo "Job started: $(date -u +%FT%TZ)"
      - name: Install dependencies
        working-directory: benchmark-app
        run: time bun install --frozen-lockfile
      - name: Typecheck
        working-directory: benchmark-app
        run: time bun run typecheck
      - name: Lint
        working-directory: benchmark-app
        run: time bun run lint
      - name: Format check
        working-directory: benchmark-app
        run: time bun fmt --check
      - name: Web build
        working-directory: benchmark-app
        run: time bun run build --filter=!desktop

  desktop-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: githubbench-nov1-desktop-${{ runner.os }}-${{ runner.arch }}-bun1.4.4-${{ hashFiles('benchmark-app/bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: githubbench-nov1-electron-linux-${{ runner.arch }}-bun1.4.4-${{ hashFiles('benchmark-app/bun.lock') }}
      - name: Machine
        run: |
          nproc; lscpu; free -h; cat /etc/os-release
          sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm
      - name: Install and build
        working-directory: benchmark-app
        env:
          DISPOSABL_DESKTOP_PLATFORM: linux
          DISPOSABL_RELEASE_VERSION: 1.0.42
        run: |
          time bun install --frozen-lockfile
          time bun run --cwd apps/desktop preview
          find dist/release -type f -exec sha256sum {} \\

  desktop-windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: githubbench-nov1-desktop-${{ runner.os }}-${{ runner.arch }}-bun1.4.4-${{ hashFiles('benchmark-app/bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: githubbench-nov1-electron-windows-${{ runner.arch }}-bun1.4.4-${{ hashFiles('benchmark-app/bun.lock') }}
      - name: Machine
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors; Get-ComputerInfo | Select-Object WindowsProductName,OsVersion
      - name: Install and build
        working-directory: benchmark-app
        env:
          DISPOSABL_DESKTOP_PLATFORM: windows
          DISPOSABL_RELEASE_VERSION: 1.0.42
        run: |
          Measure-Command { bun install --frozen-lockfile }
          Measure-Command { bun run --cwd apps/desktop preview }
          Get-ChildItem dist/release -File | Get-FileHash -Algorithm SHA256

  desktop-macos:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: githubbench-nov1-desktop-${{ runner.os }}-${{ runner.arch }}-bun1.4.4-${{ hashFiles('benchmark-app/bun.lock') }}
      - uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: githubbench-nov1-electron-macos-${{ runner.arch }}-bun1.4.4-${{ hashFiles('benchmark-app/bun.lock') }}
      - name: Machine
        run: sysctl -n machdep.cpu.brand_string; sysctl -n hw.logicalcpu; sw_vers; xcodebuild -version
      - name: Install and build
        working-directory: benchmark-app
        env:
          DISPOSABL_DESKTOP_PLATFORM: macos
          DISPOSABL_RELEASE_VERSION: 1.0.42
        run: |
          time bun install --frozen-lockfile
          time bun run --cwd apps/desktop preview
          find dist/release -type f -exec shasum -a 256 {} \\

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: githubbench-nov1-mobile-${{ runner.os }}-${{ runner.arch }}-bun1.4.4-${{ hashFiles('benchmark-app/bun.lock') }}
      - name: Machine
        run: nproc; lscpu; free -h; cat /etc/os-release; java -version; adb --version
      - name: Install and build Android
        working-directory: benchmark-app
        env:
          EXPO_PROJECT_ID: 74446a59-bd68-4e6b-823f-618c688178fe
          EXPO_OWNER: vivek-yast
          EXPO_SLUG: disposabl-starter-android
          DISPOSABL_ANDROID_CHANNEL: ci-benchmark-github
        run: |
          time bun install --frozen-lockfile
          time bun run --cwd apps/mobile build:android
          sha256sum apps/mobile/dist/android/app.apk
