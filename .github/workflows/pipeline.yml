name: Preview
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CHANNEL: &channel ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
  DISPOSABL_MOBILE_CHANNEL: *channel
  EAS_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'preview' }}
  EAS_CLI: eas-cli@27.2.0
  BUN_VERSION: &bun-version '1.4.4'
  NODE_VERSION: &node-version '24'
  LINUX_RUNNER: &linux-runner blacksmith-4vcpu-ubuntu-2404
  WINDOWS_RUNNER: &windows-runner blacksmith-4vcpu-windows-2025
  MACOS_RUNNER: &macos-runner blacksmith-6vcpu-macos-26
  MACOS_BUNDLE_ID: dev.disposabl.starter.desktop
  RELEASE_RUNNER: &release-runner blacksmith-2vcpu-ubuntu-2404
  DISPOSABL_ANDROID_VERSION_CODE: ${{ github.run_number }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_PATH: ${{ github.event_name == 'pull_request' && format('pulls/{0}', github.event.number) || 'git/ref/heads/main' }}
  ARTIFACT: platform-android
  DISPOSABL_RELEASE_VERSION: 1.0.${{ github.run_number }}

jobs:
  web:
    name: Web
    outputs:
      android: ${{ steps.platforms.outputs.android }}
      desktop: ${{ steps.platforms.outputs.desktop }}
    timeout-minutes: 45
    runs-on: *linux-runner
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER }}
      EXPO_SLUG: ${{ vars.EXPO_SLUG }}
      EXPO_NO_DOTENV: '1'
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v6
        with: {ref: "${{ env.SOURCE }}", persist-credentials: false}
      - &platforms
        name: Platforms
        shell: bash
        id: platforms
        env:
          BEFORE: ${{ github.event.before }}
          PR: ${{ github.event.number }}
          TRUSTED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ "$TRUSTED" != true ]]; then printf 'android=false\nios=false\ndesktop=[]\nselected=false\n' >> "$GITHUB_OUTPUT"; exit; fi
          if [[ -n "$PR" ]]; then
            gh api "repos/$GH_REPO/pulls/$PR/files?per_page=100" --paginate --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changes"
          elif [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then echo disposabl.json > "$RUNNER_TEMP/changes"
          else
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --depth=1 origin "$BEFORE"
            git diff --name-only --no-renames "$BEFORE" "$SOURCE" > "$RUNNER_TEMP/changes"
          fi
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const paths = readFileSync(`${process.env.RUNNER_TEMP}/changes`, "utf8").split("\n").filter(p => !/(^|\/)\.agents\/|\.(md|mdx)$/.test(p));
            const enabled = JSON.parse(readFileSync("disposabl.json", "utf8")).platforms;
            const shared = paths.some(p => /^(bun.lock$|package.json$|disposabl.json$|turbo.json$|bunfig.toml$|patches\/|\.github\/workflows\/pipeline.yml$|packages\/(?!backend\/|create-disposabl-app\/))/.test(p));
            const mobile = shared || paths.some(p => p.startsWith("apps/mobile/"));
            for (const platform of ["android", "ios"]) console.log(`${platform}=${enabled.includes(platform) && mobile}`);
            const desktop = ["linux", "windows", "macos"].filter(platform => enabled.includes(platform) && (shared || paths.some(p => p.startsWith("apps/desktop/"))));
            console.log(`desktop=${JSON.stringify(desktop)}\nselected=${desktop.includes(process.env.DISPOSABL_DESKTOP_PLATFORM)}`);
          ' >> "$GITHUB_OUTPUT"
      - &node
        name: Node
        if: github.job == 'web' || steps.platforms.outputs.selected == 'true'
        uses: actions/setup-node@v6
        with: {node-version: *node-version, package-manager-cache: false}
      - &bun
        name: Bun
        if: github.job == 'web' || steps.platforms.outputs.selected == 'true'
        uses: oven-sh/setup-bun@v2
        with: {bun-version: *bun-version}
      - &cache
        name: Cache
        if: github.job == 'web' || steps.platforms.outputs.selected == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - name: Turbo
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-
      - &install
        name: Install
        if: github.job == 'web' || steps.platforms.outputs.selected == 'true'
        run: bun install --frozen-lockfile
      - name: Check
        run: bun x --no-install turbo run typecheck lint && bun fmt --check && bun test --pass-with-no-tests
      - name: Deploy
        id: deploy
        env:
          TRUSTED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          CONVEX_DEPLOY_KEY: ${{ github.event_name == 'push' && secrets.CONVEX_DEPLOY_KEY || secrets.CONVEX_DEPLOY_KEY_PREVIEW }}
        run: |
          if [[ "$TRUSTED" != true ]]; then VITE_CONVEX_URL=https://ci.invalid VITE_CONVEX_SITE_URL=https://ci.invalid bun run build --filter=!desktop; exit; fi
          : "${CONVEX_DEPLOY_KEY:?Configure the Convex deployment secret for this repository}"
          cd packages/backend
          export AUTH_TARGET=--prod
          target=()
          if [[ "$CHANNEL" != production ]]; then export AUTH_TARGET="--preview-name $CHANNEL"; target=(--preview-name "$CHANNEL"); fi
          bun x --no-install convex deploy --yes "${target[@]}" --cmd-url-env-var-name VITE_CONVEX_URL --cmd 'bun x --no-install --package @convex-dev/auth auth --keys-only $AUTH_TARGET && VITE_CONVEX_SITE_URL="$CONVEX_SITE_URL" bun run --cwd ../.. build --filter=!desktop && printf "url=%s\nsite=%s\n" "$VITE_CONVEX_URL" "$CONVEX_SITE_URL" >> "$GITHUB_OUTPUT"'
          bun x --no-install static-hosting upload $AUTH_TARGET --no-spa --dist ../../apps/web/dist/client
      - name: Expo
        if: steps.platforms.outputs.android == 'true' || steps.platforms.outputs.ios == 'true'
        env:
          DISPOSABL_DEPLOYED_CONVEX_URL: ${{ steps.deploy.outputs.url }}
          DISPOSABL_DEPLOYED_CONVEX_SITE_URL: ${{ steps.deploy.outputs.site }}
          EXPO_PUBLIC_CONVEX_URL: ${{ steps.deploy.outputs.url }}
          EXPO_PUBLIC_CONVEX_SITE_URL: ${{ steps.deploy.outputs.site }}
        working-directory: apps/mobile
        run: |
          printf '%s\n' "DISPOSABL_DEPLOYED_CONVEX_URL=$DISPOSABL_DEPLOYED_CONVEX_URL" "DISPOSABL_DEPLOYED_CONVEX_SITE_URL=$DISPOSABL_DEPLOYED_CONVEX_SITE_URL" "EXPO_PUBLIC_CONVEX_URL=$EXPO_PUBLIC_CONVEX_URL" "EXPO_PUBLIC_CONVEX_SITE_URL=$EXPO_PUBLIC_CONVEX_SITE_URL" >> "$GITHUB_ENV"
          bun x "$EAS_CLI" env:pull --environment "$EAS_ENVIRONMENT" --path "$RUNNER_TEMP/expo.env" --non-interactive
          bun -e '
            import {parseEnv} from "node:util";
            import {appendFileSync, readFileSync} from "node:fs";
            for (const [key, value] of Object.entries(parseEnv(readFileSync(`${process.env.RUNNER_TEMP}/expo.env`, "utf8")))) {
              // Web and mobile use the same backend from this deployment.
              if (/^EXPO_PUBLIC_CONVEX_(URL|SITE_URL)$/.test(key)) continue;
              if (/^(GITHUB_|RUNNER_|GH_|DISPOSABL_|BUN_|CI$|NODE_OPTIONS$|PATH$|HOME$|SOURCE(_PATH)?$|CHANNEL$|ARTIFACT$|EAS_(ENVIRONMENT|CLI)$|EXPO_(TOKEN|PROJECT_ID|OWNER|SLUG|NO_DOTENV)$)/.test(key)) throw new Error(`Reserved EAS variable: ${key}`);
              const delimiter = crypto.randomUUID();
              appendFileSync(process.env.GITHUB_ENV, `${key}<<${delimiter}\n${value}\n${delimiter}\n`);
            }
          '
      - name: Channel
        if: steps.platforms.outputs.android == 'true' || steps.platforms.outputs.ios == 'true'
        working-directory: apps/mobile
        run: |
          for ((offset=0; ; offset+=25)); do
            bun x "$EAS_CLI" channel:list --json --limit 25 --offset "$offset" > "$RUNNER_TEMP/channels.json"
            if jq -e --arg channel "$CHANNEL" 'any(.currentPage[]; .name == $channel)' "$RUNNER_TEMP/channels.json" > /dev/null; then
              jq -e --arg channel "$CHANNEL" '.currentPage[] | select(.name == $channel) | (.isPaused == false) and (.updateBranches | length == 1) and (.updateBranches[0].name == $channel) and ((.branchMapping | fromjson).data == [{branchId: .updateBranches[0].id, branchMappingLogic: "true"}])' "$RUNNER_TEMP/channels.json" > /dev/null || { echo 'Preview channel must point only to its same-named branch'; exit 1; }
              break
            fi
            if [[ $(jq '.currentPage | length' "$RUNNER_TEMP/channels.json") -lt 25 ]]; then bun x "$EAS_CLI" channel:create "$CHANNEL" --non-interactive; break; fi
          done
      - name: Fingerprint
        id: fingerprint
        if: steps.platforms.outputs.android == 'true'
        run: |
          for ((page=1; ; page++)); do
            gh api "repos/$GH_REPO/releases?per_page=100&page=$page" > "$RUNNER_TEMP/releases.json"
            jq --arg prefix "app-$CHANNEL-" '[.[] | select(.draft | not) | select(.tag_name | startswith($prefix)) | select(any(.assets[]; .name == "android.apk"))][0] // {}' "$RUNNER_TEMP/releases.json" > "$RUNNER_TEMP/release.json"
            if jq -e '.id' "$RUNNER_TEMP/release.json" > /dev/null || [[ $(jq length "$RUNNER_TEMP/releases.json") -lt 100 ]]; then break; fi
          done
          bun -e '
            import {runtimeVersion, run} from "./apps/mobile/scripts/build-android.mjs";
            const config = JSON.parse(run("bun", ["x", "--no-install", "expo", "config", "--json"], {stdio: ["ignore", "pipe", "inherit"]}));
            if (!config.extra?.eas?.projectId) throw new Error("Link an Expo project first");
            const wanted = {channel: process.env.CHANNEL, projectId: config.extra.eas.projectId, applicationId: config.android.package, runtimeVersion: runtimeVersion()};
            const release = await Bun.file(`${process.env.RUNNER_TEMP}/release.json`).json();
            const prior = JSON.parse(/<!-- android (\{[^\n]+\}) -->/.exec(release.body || "")?.[1] || "null");
            const reusable = prior && Object.keys(wanted).every(k => prior[k] === wanted[k]) && /^[a-f0-9]{64}$/.test(prior.sha256 || "") && release.assets.some(a => a.name === "android.apk" && a.state === "uploaded" && a.size > 0 && a.digest === `sha256:${prior.sha256}`);
            console.log(`build=${!reusable}\nruntime=${wanted.runtimeVersion}\nmanifest=${JSON.stringify(wanted)}\ntag=${reusable ? release.tag_name : ""}\nsha=${reusable ? prior.sha256 : ""}`);
          ' >> "$GITHUB_OUTPUT"
      - name: Update
        if: steps.fingerprint.outputs.build == 'false'
        env:
          TAG: ${{ steps.fingerprint.outputs.tag }}
          SHA: ${{ steps.fingerprint.outputs.sha }}
          RUNTIME: ${{ steps.fingerprint.outputs.runtime }}
          MANIFEST: ${{ steps.fingerprint.outputs.manifest }}
        run: |
          mkdir -p dist/release
          gh release download "$TAG" --pattern android.apk --dir dist/release
          echo "$SHA  dist/release/android.apk" | sha256sum --check
          cd apps/mobile
          bun x --no-install expo export --platform android --output-dir dist/update
          test "$(bun -e 'import {runtimeVersion} from "./scripts/build-android.mjs"; console.log(runtimeVersion())')" = "$RUNTIME"
          test "$(gh api "repos/$GH_REPO/$SOURCE_PATH" --jq 'if has("head") then (if .state == "open" then .head.sha else "closed" end) else .object.sha end')" = "$SOURCE"
          bun x "$EAS_CLI" update --platform android --channel "$CHANNEL" --environment "$EAS_ENVIRONMENT" --skip-bundler --input-dir dist/update --message "$SOURCE" --non-interactive
          jq --arg sha "$SHA" '. + {sha256: $sha, action: "update"}' <<< "$MANIFEST" > ../../dist/release/android.json
      # iOS updates use an existing per-channel IPA; native iOS builds stay manual.
      - name: iOS
        if: steps.platforms.outputs.ios == 'true'
        working-directory: apps/mobile
        run: |
          runtime() { bun x --no-install expo-updates runtimeversion:resolve --platform ios --workflow managed | jq -er '.runtimeVersion | select(test("^[a-f0-9]{40,64}$"))'; }
          fingerprint=$(runtime)
          bundle=$(bun x --no-install expo config --json | jq -er '.ios.bundleIdentifier')
          bun x "$EAS_CLI" build:list --platform ios --status finished --distribution internal --channel "$CHANNEL" --app-identifier "$bundle" --limit 1 --json > "$RUNNER_TEMP/ios.json"
          if ! jq -e --arg runtime "$fingerprint" '.[0] | .isForIosSimulator == false and .runtime.version == $runtime and ((.artifacts.applicationArchiveUrl // "") | startswith("https://")) and (.expirationDate == null or .expirationDate > (now | todateiso8601))' "$RUNNER_TEMP/ios.json" > /dev/null; then
            echo "iOS skipped: a signed internal IPA for $CHANNEL with this fingerprint is required. Automatic iOS builds are disabled." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bun x --no-install expo export --platform ios --output-dir dist/update-ios
          test "$(runtime)" = "$fingerprint"
          test "$(gh api "repos/$GH_REPO/$SOURCE_PATH" --jq 'if has("head") then (if .state == "open" then .head.sha else "closed" end) else .object.sha end')" = "$SOURCE"
          bun x "$EAS_CLI" update --platform ios --channel "$CHANNEL" --environment "$EAS_ENVIRONMENT" --skip-bundler --input-dir dist/update-ios --message "$SOURCE" --non-interactive
          echo "iOS update published to $CHANNEL." >> "$GITHUB_STEP_SUMMARY"
      - name: Java
        if: steps.fingerprint.outputs.build == 'true'
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - name: SDK
        if: steps.fingerprint.outputs.build == 'true'
        uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - name: Gradle
        if: steps.fingerprint.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v4
        with: {cache-read-only: false}
      - name: Build
        if: steps.fingerprint.outputs.build == 'true'
        env:
          DISPOSABL_ANDROID_RUNTIME: ${{ steps.fingerprint.outputs.runtime }}
          MANIFEST: ${{ steps.fingerprint.outputs.manifest }}
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          test "$(gh api "repos/$GH_REPO/$SOURCE_PATH" --jq 'if has("head") then (if .state == "open" then .head.sha else "closed" end) else .object.sha end')" = "$SOURCE"
          bun run --cwd apps/mobile build:android
          mkdir -p dist/release
          cp apps/mobile/dist/android/app.apk dist/release/android.apk
          jq --arg sha "$(sha256sum dist/release/android.apk | cut -d' ' -f1)" '. + {sha256: $sha, action: "build"}' <<< "$MANIFEST" > dist/release/android.json
      - name: Upload
        if: steps.platforms.outputs.android == 'true'
        uses: actions/upload-artifact@v4
        with: &artifact
          name: ${{ env.ARTIFACT }}
          path: dist/release/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  desktop:
    name: ${{ matrix.platform }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, runner: *linux-runner}
          - {platform: windows, runner: *windows-runner}
          - {platform: macos, runner: *macos-runner}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARTIFACT: platform-${{ matrix.platform }}
      DISPOSABL_DESKTOP_PLATFORM: ${{ matrix.platform }}
      electron_config_cache: ${{ github.workspace }}/.cache/electron
    steps:
      - *checkout
      - *platforms
      - *node
      - *bun
      - *cache
      - *install
      - name: Electron
        if: steps.platforms.outputs.selected == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Packages
        if: steps.platforms.outputs.selected == 'true' && matrix.platform == 'linux'
        run: command -v fakeroot && command -v rpmbuild && command -v dpkg-deb || { sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm; }
      # Published previews and production use the same signing identity.
      - name: Sign
        if: steps.platforms.outputs.selected == 'true' && matrix.platform == 'macos'
        uses: apple-actions/import-codesign-certs@v7.2.0
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATES_P12_PRODUCTION }}
          p12-password: ${{ secrets.MACOS_CERTIFICATES_PASSWORD_PRODUCTION }}
      - name: Notary
        if: steps.platforms.outputs.selected == 'true' && matrix.platform == 'macos'
        env:
          API_KEY_P8: ${{ secrets.MACOS_APPLE_API_KEY_P8_PRODUCTION }}
          API_KEY_ID: ${{ secrets.MACOS_APPLE_API_KEY_ID_PRODUCTION }}
          API_ISSUER: ${{ secrets.MACOS_APPLE_API_ISSUER_PRODUCTION }}
        run: |
          : "${API_KEY_P8:?Configure MACOS_APPLE_API_KEY_P8_PRODUCTION}" "${API_KEY_ID:?Configure MACOS_APPLE_API_KEY_ID_PRODUCTION}" "${API_ISSUER:?Configure MACOS_APPLE_API_ISSUER_PRODUCTION}"
          umask 077
          printf '%s' "$API_KEY_P8" > "$RUNNER_TEMP/notary.p8"
          printf 'APPLE_API_KEY=%s\nAPPLE_API_KEY_ID=%s\nAPPLE_API_ISSUER=%s\n' "$RUNNER_TEMP/notary.p8" "$API_KEY_ID" "$API_ISSUER" >> "$GITHUB_ENV"
      - name: Build
        if: steps.platforms.outputs.selected == 'true'
        run: bun run --cwd apps/desktop preview
      - name: Verify
        if: steps.platforms.outputs.selected == 'true' && matrix.platform == 'macos'
        run: |
          zips=(dist/release/*.zip)
          test "${#zips[@]}" -eq 1 && test -s "${zips[0]}"
          ditto -x -k "${zips[0]}" "$RUNNER_TEMP/macos-verify"
          apps=("$RUNNER_TEMP/macos-verify/"*.app)
          test "${#apps[@]}" -eq 1 && test -d "${apps[0]}"
          codesign --verify --deep --strict "${apps[0]}"
          spctl --assess --type execute --verbose "${apps[0]}"
          xcrun stapler validate "${apps[0]}"
      - name: Upload
        if: steps.platforms.outputs.selected == 'true'
        uses: actions/upload-artifact@v4
        with: *artifact
      - name: Clean
        if: always() && matrix.platform == 'macos'
        run: rm -f "$RUNNER_TEMP/notary.p8"

  release:
    name: Release
    needs: [web, desktop]
    if: ${{ !cancelled() && needs.web.result == 'success' && (needs.desktop.result == 'success' || needs.desktop.result == 'skipped') && (needs.web.outputs.android == 'true' || fromJSON(needs.web.outputs.desktop)[0] != null) }}
    runs-on: *release-runner
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: platform-*
          path: dist/release
      - name: Publish
        env:
          ANDROID: ${{ needs.web.outputs.android }}
          DESKTOP: ${{ needs.web.outputs.desktop }}
        run: |
          check_source() { test "$(gh api "repos/$GH_REPO/$SOURCE_PATH" --jq 'if has("head") then (if .state == "open" then .head.sha else "closed" end) else .object.sha end')" = "$SOURCE"; }
          check_source
          expected=$(jq -r --arg android "$ANDROID" '. + (if $android == "true" then ["android"] else [] end) | .[]' <<< "$DESKTOP")
          for platform in $expected; do test -d "dist/release/platform-$platform"; test -n "$(find "dist/release/platform-$platform" -type f -size +0c -print -quit)"; done
          if [[ "$ANDROID" == true ]]; then test -s dist/release/platform-android/android.apk; test -s dist/release/platform-android/android.json; fi
          find dist/release -mindepth 2 -type f -exec mv -n {} dist/release/ \;
          find dist/release -mindepth 1 -type d -empty -delete
          test "$(find dist/release -mindepth 1 -type d | wc -l)" -eq 0
          TAG="app-$CHANNEL-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "Source: $SOURCE" > notes.md
          if [[ -f dist/release/android.json ]]; then echo "<!-- android $(jq -c . dist/release/android.json) -->" >> notes.md; fi
          gh release create "$TAG" dist/release/* --draft --target "$SOURCE" --title "$CHANNEL" --notes-file notes.md --prerelease=${{ github.event_name == 'pull_request' }}
          check_source && gh release edit "$TAG" --draft=false --latest=false
