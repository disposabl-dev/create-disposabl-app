name: Pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel obsolete PRs; finish active production releases and keep only the latest pending run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CHANNEL: &channel ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
  DISPOSABL_MOBILE_CHANNEL: *channel
  EAS_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'preview' }}
  EAS_CLI: eas-cli@27.2.0
  BUN_VERSION: &bun-version "1.4.4"
  NODE_VERSION: &node-version "24"
  LINUX_RUNNER: &linux-runner ubuntu-24.04
  WEB_RUNNER: ubuntu-24.04
  WINDOWS_RUNNER: windows-2025
  MACOS_RUNNER: macos-26
  RELEASE_PREFIX: app
  DISPOSABL_ANDROID_VERSION_CODE: ${{ github.run_number }}
  DISPOSABL_IOS_BUILD_NUMBER: ${{ github.run_number }}
  # Build jobs only read this repository. Keep installation tokens in publishing jobs.
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_PATH: ${{ github.event_name == 'pull_request' && format('pulls/{0}', github.event.number) || 'git/ref/heads/main' }}
  DISPOSABL_RELEASE_VERSION: 1.0.${{ github.run_number }}
jobs:
  changes:
    name: Select work
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: read
      actions: read
    runs-on: *linux-runner
    timeout-minutes: 30
    outputs:
      linux_runner: ${{ steps.platforms.outputs.linux_runner }}
      android_runner: ${{ steps.platforms.outputs.android_runner }}
      macos_runner: ${{ steps.platforms.outputs.macos_runner }}
      changed: ${{ steps.platforms.outputs.changed }}
      android: ${{ steps.platforms.outputs.android }}
      ios: ${{ steps.platforms.outputs.ios }}
      desktop: ${{ steps.platforms.outputs.desktop }}
      packages: ${{ steps.platforms.outputs.packages }}
    steps:
      - &checkout
        uses: actions/checkout@v6
        with: { ref: "${{ env.SOURCE }}", persist-credentials: false }
      - name: Select affected platforms
        shell: bash
        id: platforms
        env:
          PR: ${{ github.event.number }}
          EXPO_CONNECTED: ${{ secrets.EXPO_TOKEN != '' }}
          IOS_BUILDS_ENABLED: ${{ vars.IOS_BUILDS_ENABLED != 'false' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/platforms.sh"
      - name: Product checks
        if: github.repository == 'disposabl-dev/create-disposabl-app'
        uses: ./.github/actions/product-checks
        with:
          source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
        env:
          GH_TOKEN: ""
          PYTHONDONTWRITEBYTECODE: "1"
          DO_NOT_TRACK: "1"
          E2E_TELEMETRY_DISABLED: "1"
          EXPO_NO_TELEMETRY: "1"
          DISPOSABL_ANALYTICS_ENABLED: "false"
          EXPO_PUBLIC_DISPOSABL_ANALYTICS_ENABLED: "false"
          VITE_DISPOSABL_ANALYTICS_ENABLED: "false"
  web:
    name: Web
    needs: [changes]
    # Fork code must not run in a job with deployment credentials.
    if: always() && !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.changed == 'true' || (github.event_name == 'push' && github.repository == 'disposabl-dev/create-disposabl-app'))
    permissions: &release-permissions
      contents: read
      pull-requests: read
      id-token: write
    timeout-minutes: 20
    runs-on: ${{ needs.changes.outputs.linux_runner }}
    outputs:
      desktop: ${{ needs.changes.outputs.desktop }}
      ios: ${{ needs.changes.outputs.ios }}
      packages: ${{ needs.changes.outputs.packages }}
      release: ${{ steps.artifacts.outcome == 'success' }}
      android_build: ${{ needs.changes.outputs.android == 'true' && github.event_name == 'push' && github.repository == 'disposabl-dev/create-disposabl-app' && 'true' || steps.fingerprint.outputs.build }}
      android_runtime: ${{ steps.fingerprint.outputs.runtime }}
      android_version_code: ${{ steps.android-version.outputs.version }}
      convex_url: ${{ steps.deploy.outputs.CONVEX_URL }}
      convex_site_url: ${{ steps.deploy.outputs.CONVEX_SITE_URL }}
    env:
      PLATFORM: android
      DISPOSABL_ANDROID_SIGNING: ${{ github.event_name == 'push' && secrets.DISPOSABL_ANDROID_SIGNING || '' }}
      ANDROID_KEYSTORE_BASE64: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_PASSWORD || '' }}
      ANDROID_PLAY_SUBMIT: ${{ vars.ANDROID_PLAY_SUBMIT }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID || vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER || vars.EXPO_OWNER }}
      EXPO_SLUG: ${{ secrets.EXPO_SLUG || vars.EXPO_SLUG }}
      EXPO_NO_DOTENV: "1"
    steps:
      - *checkout
      - &node
        uses: actions/setup-node@v6
        with: { node-version: *node-version, package-manager-cache: false }
      - name: Check product release guards
        if: github.repository == 'disposabl-dev/create-disposabl-app'
        run: |
          python3 .github/scripts/play-bundle.test.py
          python3 .github/scripts/android-release.test.py
          node --test .github/scripts/android-bundle-verify.test.mjs
      - &bun
        uses: oven-sh/setup-bun@v2
        with: { bun-version: *bun-version }
      - &cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ github.job == 'desktop' && 'desktop-' || '' }}${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ github.job == 'desktop' && 'desktop-' || '' }}${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - &install
        run: bun install --frozen-lockfile ${{ github.job == 'desktop' && '--filter "*desktop*" --filter @disposabl/backend' || (github.job == 'android' || startsWith(github.job, 'ios-')) && '--filter @disposabl/mobile' || '' }}
      - name: Report build start
        run: |
          node .github/scripts/disposabl.mjs report web,api,mcp building
          if [[ -z "$EXPO_TOKEN" ]]; then node .github/scripts/disposabl.mjs report android blocked 'Connect Expo before building Android.'; fi
          if [[ '${{ github.event_name }}' == pull_request ]]; then node .github/scripts/disposabl.mjs report cli,typescript-sdk blocked 'Packages publish after merge to main.'; fi
      - name: Check
        run: bun run check
      - name: Build selected clients
        run: |
          for package in cli sdk; do
            if test -f "packages/$package/package.json"; then bun run --cwd "packages/$package" build; fi
          done
      - name: Deploy
        id: deploy
        timeout-minutes: 10
        env:
          TRUSTED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          CONVEX_DEPLOY_KEY: ${{ secrets[github.event_name == 'push' && 'CONVEX_DEPLOY_KEY' || 'CONVEX_DEPLOY_KEY_PREVIEW'] }}
        run: |
          if [[ "$TRUSTED" != true ]]; then VITE_CONVEX_URL=https://ci.invalid VITE_CONVEX_SITE_URL=https://ci.invalid bun run build --filter=@disposabl/web; exit; fi
          : "${CONVEX_DEPLOY_KEY:?Configure the Convex deployment secret for this repository}"
          cd packages/backend
          export AUTH_TARGET=--prod
          target=()
          if [[ "$CHANNEL" != production ]]; then export AUTH_TARGET="--preview-name $CHANNEL"; target=(--preview-name "$CHANNEL"); fi
          bun x --no-install convex deploy --yes "${target[@]}" --cmd-url-env-var-name CONVEX_URL --cmd 'for name in CONVEX_URL CONVEX_SITE_URL; do value=$(printenv "$name"); test -n "$value" || exit 1; for prefix in "" VITE_ EXPO_PUBLIC_; do export "$prefix$name=$value"; printf "%s=%s\n" "$prefix$name" "$value" | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"; done; done; bun run --cwd ../.. build --filter=@disposabl/web'
          setup_target=(--prod)
          if [[ "$CHANNEL" != production ]]; then setup_target=("${target[@]}"); fi
          bun x --no-install convex run "${setup_target[@]}" billing:setup '{}'
          bun x --no-install static-hosting upload $AUTH_TARGET --no-spa --dist ../../apps/web/dist/client
      - name: Report web result
        if: always()
        run: node .github/scripts/disposabl.mjs report web,api,mcp ${{ steps.deploy.outcome == 'success' && 'ready' || 'failed' }}
      - name: Allocate product Android version
        id: android-version
        if: needs.changes.outputs.android == 'true' && github.event_name == 'push' && github.repository == 'disposabl-dev/create-disposabl-app'
        run: |
          [[ "$GITHUB_RUN_NUMBER" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_NUMBER" -le 20999989 ]] || { echo 'Invalid pipeline run number' >&2; exit 1; }
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]?$ ]] || { echo 'Invalid pipeline attempt' >&2; exit 1; }
          version=$((1000 + 100 * GITHUB_RUN_NUMBER + GITHUB_RUN_ATTEMPT))
          echo "DISPOSABL_ANDROID_VERSION_CODE=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Expo
        if: needs.changes.outputs.android == 'true'
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-env
      - name: Channel
        if: needs.changes.outputs.android == 'true' && !(github.event_name == 'push' && github.repository == 'disposabl-dev/create-disposabl-app')
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-channel
      - name: Fingerprint
        id: fingerprint
        if: needs.changes.outputs.android == 'true'
        env:
          UPDATE_POLICY: ${{ github.event_name == 'push' && github.repository == 'disposabl-dev/create-disposabl-app' && 'disabled' || '' }}
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-fingerprint
      - name: Update
        if: steps.fingerprint.outputs.build == 'false' && !(github.event_name == 'push' && github.repository == 'disposabl-dev/create-disposabl-app')
        env:
          TAG: ${{ steps.fingerprint.outputs.tag }}
          SHA: ${{ steps.fingerprint.outputs.sha }}
          RUNTIME: ${{ steps.fingerprint.outputs.runtime }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-update
      - &publish
        name: Publish
        if: github.job == 'android' || (github.job == 'web' && hashFiles('dist/release/android.json') != '') || github.job == 'desktop'
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/release.sh" verify-artifacts
      - &artifacts
        name: Upload release artifacts
        id: artifacts
        if: hashFiles('dist/release/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.PLATFORM }}
          path: dist/release/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
  android:
    name: Android
    needs: [changes, web]
    if: needs.web.outputs.android_build == 'true'
    permissions: *release-permissions
    runs-on: ${{ needs.changes.outputs.android_runner }}
    timeout-minutes: 30
    env:
      PLATFORM: android
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID || vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER || vars.EXPO_OWNER }}
      EXPO_SLUG: ${{ secrets.EXPO_SLUG || vars.EXPO_SLUG }}
      EXPO_NO_DOTENV: "1"
      CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      EXPO_PUBLIC_CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      EXPO_PUBLIC_CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
    steps:
      - *checkout
      - name: Prepare Android disk space
        run: bash .github/scripts/android-runner.sh prepare
      - *node
      - *bun
      - *cache
      - *install
      - name: Report mobile build
        run: node .github/scripts/disposabl.mjs report "$PLATFORM" building
      - name: Expo
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-env
      - name: Java
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: SDK
        uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: false }
      - name: Restore native compiler cache
        if: github.event_name == 'push'
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: android-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
      - name: Install native compiler cache
        if: github.event_name == 'push' && steps.native-cache.outputs.cache-hit == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ccache
          printf 'CCACHE_DIR=%s\nCCACHE_COMPILERCHECK=content\nCMAKE_C_COMPILER_LAUNCHER=ccache\nCMAKE_CXX_COMPILER_LAUNCHER=ccache\n' "$RUNNER_TEMP/ccache" >> "$GITHUB_ENV"
      - name: Select Android bundle validation
        id: bundletool-needed
        env:
          SIGNING_BUNDLE: ${{ github.event_name == 'push' && secrets.DISPOSABL_ANDROID_SIGNING || '' }}
          SIGNING_STORE: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          SIGNING_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          SIGNING_ALIAS: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_ALIAS || '' }}
          SIGNING_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [[ -n "$SIGNING_BUNDLE$SIGNING_STORE$SIGNING_PASSWORD$SIGNING_ALIAS$SIGNING_KEY_PASSWORD" ]]; then echo 'needed=true' >> "$GITHUB_OUTPUT"; fi
      - name: Download verified bundletool
        if: steps.bundletool-needed.outputs.needed == 'true'
        run: |
          curl --fail --location --silent --show-error --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar --output "$RUNNER_TEMP/bundletool.jar"
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  '"$RUNNER_TEMP/bundletool.jar" | sha256sum --check --status
      - name: Build
        working-directory: apps/mobile
        env:
          RUNTIME: ${{ needs.web.outputs.android_runtime }}
          BUNDLETOOL_JAR: ${{ runner.temp }}/bundletool.jar
          UPDATE_POLICY: ${{ github.event_name == 'push' && github.repository == 'disposabl-dev/create-disposabl-app' && 'disabled' || '' }}
          DISPOSABL_ANDROID_VERSION_CODE: ${{ needs.web.outputs.android_version_code || github.run_number }}
          DISPOSABL_ANDROID_CHANNEL: *channel
          DISPOSABL_ANDROID_SIGNING: ${{ github.event_name == 'push' && secrets.DISPOSABL_ANDROID_SIGNING || '' }}
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" android-build
      - *publish
      - *artifacts
  android-submit:
    name: Android Play submission
    needs: android
    if: github.event_name == 'push' && vars.ANDROID_PLAY_SUBMIT == 'true' && needs.android.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID || vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER || vars.EXPO_OWNER }}
      EXPO_SLUG: ${{ secrets.EXPO_SLUG || vars.EXPO_SLUG }}
      EXPO_NO_DOTENV: "1"
    steps:
      - *checkout
      - *node
      - *bun
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: dist/release
      - name: Verify product Play identity
        if: github.repository == 'disposabl-dev/create-disposabl-app'
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          bash .github/scripts/play-bundle.sh verify-submission-source
          test "$(jq -er .applicationId dist/release/android.json)" = com.yastai.disposabl
          keytool -printcert -jarfile dist/release/android.aab | grep -F 'SHA1: B5:8D:03:56:8C:BC:03:62:D4:A8:7A:0E:63:EC:83:C9:55:B0:29:A7' >/dev/null
      - name: Submit Android bundle
        working-directory: apps/mobile
        env:
          ANDROID_PLAY_SERVICE_ACCOUNT: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT }}
          ANDROID_PLAY_TRACK: ${{ vars.ANDROID_PLAY_TRACK }}
          ANDROID_PLAY_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_PLAY_UPLOAD_CERT_SHA256 }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" android-submit
  android-failure:
    name: Report Android failure
    needs: android
    if: always() && (needs.android.result == 'failure' || needs.android.result == 'cancelled')
    permissions:
      contents: read
      id-token: write
    runs-on: *linux-runner
    timeout-minutes: 5
    steps:
      - *checkout
      - *node
      - run: node .github/scripts/disposabl.mjs report android failed "Android build failed or was cancelled; check the workflow log."
  ios-preview:
    name: iOS simulator preview
    needs: [changes, web]
    if: github.event_name == 'pull_request' && needs.web.outputs.ios == 'true'
    permissions: *release-permissions
    runs-on: ${{ needs.changes.outputs.macos_runner }}
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      EXPO_PUBLIC_CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      EXPO_PUBLIC_CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID || vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER || vars.EXPO_OWNER }}
      EXPO_SLUG: ${{ secrets.EXPO_SLUG || vars.EXPO_SLUG }}
      EXPO_NO_DOTENV: "1"
    steps:
      - *checkout
      - *node
      - *bun
      - *cache
      - *install
      - name: Report build
        run: node .github/scripts/disposabl.mjs report ios building
      - name: Load Expo environment
        if: env.EXPO_TOKEN != ''
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-env
      - name: Verify update channel
        if: env.EXPO_TOKEN != ''
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-channel
      - name: Publish compatible iOS preview update
        if: env.EXPO_TOKEN != ''
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" ota
      - name: Xcode toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Build simulator archive
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" simulator
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: dist/apple/ios-simulator.zip
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Report simulator archive
        run: |
          echo 'iOS simulator archive is available in this workflow run’s artifacts; it is not a device or TestFlight build.' >> "$GITHUB_STEP_SUMMARY"
          node .github/scripts/disposabl.mjs report ios ready 'Simulator archive available in workflow artifacts.'
      - name: Report failure
        if: failure() || cancelled()
        run: node .github/scripts/disposabl.mjs report ios failed 'iOS simulator build failed; check the workflow log.'
  ios-production:
    name: iOS production and TestFlight
    needs: [changes, web]
    if: github.event_name == 'push' && needs.web.outputs.ios == 'true'
    permissions: *release-permissions
    runs-on: ${{ needs.changes.outputs.linux_runner }}
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID || vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER || vars.EXPO_OWNER }}
      EXPO_SLUG: ${{ secrets.EXPO_SLUG || vars.EXPO_SLUG }}
      EXPO_NO_DOTENV: "1"
      CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      EXPO_PUBLIC_CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      EXPO_PUBLIC_CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
    steps:
      - *checkout
      - *node
      - *bun
      - *cache
      - *install
      - name: Check Expo connection
        id: apple-prerequisites
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" prerequisites
      - name: Load Expo environment
        if: steps.apple-prerequisites.outputs.ready == 'true'
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-env
      - name: Verify update channel
        if: steps.apple-prerequisites.outputs.ready == 'true'
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-channel
      - name: Select iOS update or native build
        id: ios-plan
        if: steps.apple-prerequisites.outputs.ready == 'true'
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" ota-plan
      - name: Publish compatible iOS production update
        if: steps.ios-plan.outputs.action == 'update'
        working-directory: apps/mobile
        env:
          RUNTIME: ${{ steps.ios-plan.outputs.runtime }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" ota
      - name: Build and submit to TestFlight
        if: steps.ios-plan.outputs.action == 'build'
        working-directory: apps/mobile
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID || vars.ASC_APP_ID }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" production
      - name: Reconcile delivery of the compatible native build
        if: steps.ios-plan.outputs.action == 'update'
        working-directory: apps/mobile
        env:
          BUILD_ID: ${{ steps.ios-plan.outputs.build_id }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID || vars.ASC_APP_ID }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" deliver
      - name: Report failure
        if: failure() || cancelled()
        run: node .github/scripts/disposabl.mjs report ios failed 'iOS update, native build or submission failed; check the workflow log.'
  desktop:
    needs: web
    permissions: *release-permissions
    name: ${{ matrix.platform }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.web.outputs.desktop != '[]' && needs.web.outputs.desktop != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.web.outputs.desktop) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PLATFORM: ${{ matrix.platform }}
      DISPOSABL_RELEASE_VERSION: 1.${{ github.run_number }}.${{ github.run_attempt }}
      DISPOSABL_DESKTOP_PLATFORM: ${{ matrix.platform }}
      DISPOSABL_DESKTOP_UPDATE_CHANNEL: production
      CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      electron_config_cache: ${{ github.workspace }}/.cache/electron
    steps:
      - *checkout
      - *node
      - *bun
      - *cache
      - *install
      - name: Report desktop build
        run: node .github/scripts/disposabl.mjs report "$PLATFORM" building
      - name: Electron
        uses: actions/cache@v4
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Packages
        if: matrix.platform == 'linux'
        run: command -v fakeroot && command -v rpmbuild && command -v dpkg-deb || { sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm; }
      - name: Configure desktop update identity
        shell: bash
        run: |
          id=$(node -p "require('./disposabl.json').desktopId || ''")
          if [[ ! "$id" =~ ^[a-f0-9]{32}$ ]]; then echo 'Desktop identity missing; regenerate this app before its first installation.' >&2; exit 1; fi
          echo "DISPOSABL_DESKTOP_ID=$id" >> "$GITHUB_ENV"
          echo "DISPOSABL_DESKTOP_UPDATE_URL=${CONVEX_SITE_URL}/desktop/updates/$id" >> "$GITHUB_ENV"
      - name: Build
        if: matrix.platform != 'macos'
        run: bun run --cwd apps/desktop preview
      - name: Build macOS
        if: matrix.platform == 'macos'
        shell: bash
        env:
          MACOS_SIGNING_CONFIG: ${{ secrets.MACOS_SIGNING_CONFIG }}
        run: bash .github/scripts/macos-release.sh
      - *publish
      - name: Publish desktop update feed
        if: matrix.platform == 'windows' || (matrix.platform == 'macos' && env.MACOS_NOTARIZE == 'true')
        shell: bash
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$SOURCE"
          node apps/desktop/publish-update.mjs
      - name: Upload desktop release artifacts
        if: matrix.platform != 'macos' || env.MACOS_NOTARIZE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.PLATFORM }}
          path: dist/release/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Upload staged update feed
        if: matrix.platform != 'linux' && env.DISPOSABL_DESKTOP_UPDATE_URL != '' && (matrix.platform != 'macos' || env.MACOS_NOTARIZE == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: desktop-update-${{ env.PLATFORM }}
          path: dist/update/
          retention-days: 3
          if-no-files-found: error
      - name: Upload unsigned macOS artifact
        if: matrix.platform == 'macos' && env.MACOS_NOTARIZE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned
          path: |
            dist/release/*.dmg
            dist/release/*.zip
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - name: Report macOS artifact
        if: matrix.platform == 'macos' && env.MACOS_NOTARIZE != 'true'
        run: |
          echo 'macOS DMG is ad-hoc signed, not Developer ID signed or notarized. Download it from this workflow run’s artifacts.' >> "$GITHUB_STEP_SUMMARY"
          node .github/scripts/disposabl.mjs report macos blocked 'Ad-hoc signed DMG available in workflow artifacts; Developer ID signing and notarization are not configured.'
      - name: Report desktop failure
        if: failure() || cancelled()
        run: node .github/scripts/disposabl.mjs report "$PLATFORM" failed
      - name: Clean up macOS signing
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: bash .github/scripts/macos-release.sh cleanup
  packages:
    name: Package / ${{ matrix.package }}
    needs: [changes, web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.web.outputs.packages != '[]' && needs.web.outputs.packages != ''
    runs-on: ${{ needs.changes.outputs.linux_runner }}
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-${{ matrix.package }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.web.outputs.packages) }}
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, persist-credentials: false }
      - *node
      - *bun
      - *cache
      - *install
      - name: Disposabl GitHub App token
        run: node .github/scripts/disposabl.mjs token
      - name: Publish package if configured
        run: bash .github/scripts/release.sh package-release

  # The publisher executes scripts from main only; the authorizer verifies workflow_sha.
  publish:
    needs: [changes, web, android, desktop]
    if: always() && !cancelled() && needs.web.result == 'success' && (needs.web.outputs.release == 'true' || needs.android.result == 'success' || needs.desktop.result == 'success')
    environment: publishing
    runs-on: ${{ needs.changes.outputs.linux_runner }}
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Disposabl installation token
        run: node .github/scripts/disposabl.mjs token
      - name: Select release source
        id: source
        run: bash .github/scripts/release.sh release-source
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.current == 'true'
        with:
          pattern: release-*
          path: artifacts
      - name: Publish verified build artifacts
        if: steps.source.outputs.current == 'true'
        run: bash .github/scripts/release.sh release-publish
