name: Pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: preview-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CHANNEL: &channel ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
  DISPOSABL_MOBILE_CHANNEL: *channel
  EAS_ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'preview' }}
  EAS_CLI: eas-cli@27.2.0
  BUN_VERSION: &bun-version "1.4.4"
  NODE_VERSION: &node-version "24"
  LINUX_RUNNER: &linux-runner ubuntu-latest
  WEB_RUNNER: &web-runner ubuntu-latest
  WINDOWS_RUNNER: windows-2025
  MACOS_RUNNER: macos-15
  RELEASE_PREFIX: app
  DISPOSABL_ANDROID_VERSION_CODE: ${{ github.run_number }}
  DISPOSABL_IOS_BUILD_NUMBER: ${{ github.run_number }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
  SOURCE_PATH: ${{ github.event_name == 'pull_request' && format('pulls/{0}', github.event.number) || 'git/ref/heads/main' }}
  DISPOSABL_RELEASE_VERSION: 1.0.${{ github.run_number }}
jobs:
  web:
    name: Web
    # Fork code must not run in a job with deployment credentials.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions: &release-permissions
      contents: read
      pull-requests: read
      id-token: write
    timeout-minutes: 45
    runs-on: *web-runner
    outputs:
      desktop: ${{ steps.platforms.outputs.desktop }}
      ios: ${{ steps.platforms.outputs.ios }}
      android_build: ${{ steps.fingerprint.outputs.build }}
      android_runtime: ${{ steps.fingerprint.outputs.runtime }}
      android_manifest: ${{ steps.fingerprint.outputs.manifest }}
      convex_url: ${{ steps.deploy.outputs.CONVEX_URL }}
      convex_site_url: ${{ steps.deploy.outputs.CONVEX_SITE_URL }}
    env:
      PLATFORM: android
      ANDROID_SIGNING_READY: ${{ secrets.DISPOSABL_ANDROID_SIGNING != '' || (secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '') }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID || vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER || vars.EXPO_OWNER }}
      EXPO_SLUG: ${{ secrets.EXPO_SLUG || vars.EXPO_SLUG }}
      EXPO_NO_DOTENV: "1"
    steps:
      - &checkout
        uses: actions/checkout@v6
        with: { ref: "${{ env.SOURCE }}", persist-credentials: false }
      - &platforms
        name: Platforms
        shell: bash
        id: platforms
        env:
          BEFORE: ${{ github.event.before }}
          PR: ${{ github.event.number }}
          TRUSTED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/platforms.sh"
      - &node
        uses: actions/setup-node@v6
        with: { node-version: *node-version, package-manager-cache: false }
      - &app-token
        name: Disposabl GitHub App token
        run: node .github/scripts/disposabl.mjs token
      - &bun
        uses: oven-sh/setup-bun@v2
        with: { bun-version: *bun-version }
      - &cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ github.job == 'desktop' && 'desktop-' || '' }}${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ github.job == 'desktop' && 'desktop-' || '' }}${{ runner.os }}-${{ runner.arch }}-${{ env.BUN_VERSION }}-
      - &install
        run: bun install --frozen-lockfile ${{ github.job == 'desktop' && '--filter desktop' || (github.job == 'android') && '--filter @disposabl/mobile' || '' }}
      - name: Report build start
        run: |
          node .github/scripts/disposabl.mjs report web,api,mcp building
          if [[ -z "$EXPO_TOKEN" ]]; then node .github/scripts/disposabl.mjs report android blocked 'Connect Expo before building Android.'; fi
          if [[ '${{ github.event_name }}' == pull_request ]]; then node .github/scripts/disposabl.mjs report cli,typescript-sdk blocked 'Packages publish after merge to main.'; fi
      - name: Check
        run: bun run check
      - name: Build selected clients
        run: |
          for package in cli sdk; do
            if test -f "packages/$package/package.json"; then bun run --cwd "packages/$package" build; fi
          done
      - name: Deploy
        id: deploy
        env:
          TRUSTED: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          CONVEX_DEPLOY_KEY: ${{ secrets[github.event_name == 'push' && 'CONVEX_DEPLOY_KEY' || 'CONVEX_DEPLOY_KEY_PREVIEW'] }}
        run: |
          if [[ "$TRUSTED" != true ]]; then VITE_CONVEX_URL=https://ci.invalid VITE_CONVEX_SITE_URL=https://ci.invalid bun run build --filter=@disposabl/web; exit; fi
          : "${CONVEX_DEPLOY_KEY:?Configure the Convex deployment secret for this repository}"
          cd packages/backend
          export AUTH_TARGET=--prod
          target=()
          if [[ "$CHANNEL" != production ]]; then export AUTH_TARGET="--preview-name $CHANNEL"; target=(--preview-name "$CHANNEL"); fi
          bun x --no-install convex deploy --yes "${target[@]}" --cmd-url-env-var-name CONVEX_URL --cmd 'for name in CONVEX_URL CONVEX_SITE_URL; do value=$(printenv "$name"); test -n "$value" || exit 1; for prefix in "" VITE_ EXPO_PUBLIC_; do export "$prefix$name=$value"; printf "%s=%s\n" "$prefix$name" "$value" | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"; done; done; bun x --no-install --package @convex-dev/auth auth --keys-only $AUTH_TARGET && bun run --cwd ../.. build --filter=@disposabl/web'
          bun x --no-install static-hosting upload $AUTH_TARGET --no-spa --dist ../../apps/web/dist/client
      - name: Report web result
        if: always()
        run: node .github/scripts/disposabl.mjs report web,api,mcp ${{ steps.deploy.outcome == 'success' && 'ready' || 'failed' }}
      - &expo
        name: Expo
        if: github.job == 'android' || steps.platforms.outputs.android == 'true'
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-env
      - name: Channel
        if: steps.platforms.outputs.android == 'true'
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-channel
      - name: Fingerprint
        id: fingerprint
        if: steps.platforms.outputs.android == 'true'
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-fingerprint
      - name: Update
        if: steps.fingerprint.outputs.build == 'false'
        env:
          TAG: ${{ steps.fingerprint.outputs.tag }}
          SHA: ${{ steps.fingerprint.outputs.sha }}
          RUNTIME: ${{ steps.fingerprint.outputs.runtime }}
          MANIFEST: ${{ steps.fingerprint.outputs.manifest }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-update
      - &publish
        name: Publish
        if: github.job == 'android' || (github.job == 'web' && hashFiles('dist/release/android.json') != '') || github.job == 'desktop'
        shell: bash
        run: bash "$GITHUB_WORKSPACE/.github/scripts/release.sh" verify-artifacts
      - &artifacts
        name: Upload release artifacts
        if: hashFiles('dist/release/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.PLATFORM }}
          path: dist/release/
          retention-days: 3
          if-no-files-found: error
  android:
    name: Android
    needs: web
    if: needs.web.outputs.android_build == 'true'
    permissions: *release-permissions
    runs-on: *linux-runner
    timeout-minutes: 60
    env:
      PLATFORM: android
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID || vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER || vars.EXPO_OWNER }}
      EXPO_SLUG: ${{ secrets.EXPO_SLUG || vars.EXPO_SLUG }}
      EXPO_NO_DOTENV: "1"
      CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      EXPO_PUBLIC_CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      EXPO_PUBLIC_CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
    steps:
      - *checkout
      - *platforms
      - *node
      - *app-token
      - *bun
      - *cache
      - *install
      - name: Report mobile build
        run: node .github/scripts/disposabl.mjs report "$PLATFORM" building
      - *expo
      - name: Java
        uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: SDK
        uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with: { cache-read-only: false }
      - name: Build
        working-directory: apps/mobile
        env:
          RUNTIME: ${{ needs.web.outputs.android_runtime }}
          DISPOSABL_ANDROID_CHANNEL: *channel
          MANIFEST: ${{ needs.web.outputs.android_manifest }}
          DISPOSABL_ANDROID_SIGNING: ${{ github.event_name == 'push' && secrets.DISPOSABL_ANDROID_SIGNING || '' }}
          ANDROID_KEYSTORE_BASE64: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" android-build
      - *publish
      - *artifacts
      - name: Report Android failure
        if: failure() || cancelled()
        run: node .github/scripts/disposabl.mjs report android failed
  ios-preview:
    name: iOS simulator preview
    needs: web
    if: github.event_name == 'pull_request' && needs.web.outputs.ios == 'true'
    permissions: *release-permissions
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.0.app/Contents/Developer
      CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      EXPO_PUBLIC_CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      EXPO_PUBLIC_CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID || vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER || vars.EXPO_OWNER }}
      EXPO_SLUG: ${{ secrets.EXPO_SLUG || vars.EXPO_SLUG }}
      EXPO_NO_DOTENV: "1"
    steps:
      - *checkout
      - *node
      - *app-token
      - *bun
      - *cache
      - *install
      - name: Report build
        run: node .github/scripts/disposabl.mjs report ios building
      - name: Xcode toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Build simulator archive
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" simulator
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: dist/apple/ios-simulator.zip
          retention-days: 3
          if-no-files-found: error
      - name: Report simulator archive
        run: |
          echo 'iOS simulator archive is available in this workflow run’s artifacts; it is not a device or TestFlight build.' >> "$GITHUB_STEP_SUMMARY"
          node .github/scripts/disposabl.mjs report ios ready 'Simulator archive available in workflow artifacts.'
      - name: Report failure
        if: failure() || cancelled()
        run: node .github/scripts/disposabl.mjs report ios failed 'iOS simulator build failed; check the workflow log.'
  ios-production:
    name: iOS production and TestFlight
    needs: web
    if: github.event_name == 'push' && needs.web.outputs.ios == 'true'
    permissions: *release-permissions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID || vars.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER || vars.EXPO_OWNER }}
      EXPO_SLUG: ${{ secrets.EXPO_SLUG || vars.EXPO_SLUG }}
      EXPO_NO_DOTENV: "1"
      CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      EXPO_PUBLIC_CONVEX_URL: ${{ needs.web.outputs.convex_url }}
      EXPO_PUBLIC_CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
    steps:
      - *checkout
      - *node
      - *app-token
      - *bun
      - *cache
      - *install
      - name: Check Expo connection
        id: apple-prerequisites
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" prerequisites
      - name: Load Expo environment
        if: steps.apple-prerequisites.outputs.ready == 'true'
        working-directory: apps/mobile
        run: bash "$GITHUB_WORKSPACE/.github/scripts/mobile.sh" expo-env
      - name: Build and submit to TestFlight
        if: steps.apple-prerequisites.outputs.ready == 'true'
        working-directory: apps/mobile
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID || vars.ASC_APP_ID }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/apple.sh" production
      - name: Report failure
        if: failure() || cancelled()
        run: node .github/scripts/disposabl.mjs report ios failed 'iOS production build or submission failed; check the workflow log.'
  desktop:
    needs: web
    permissions: *release-permissions
    name: ${{ matrix.platform }}
    if: needs.web.outputs.desktop != '[]' && needs.web.outputs.desktop != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.web.outputs.desktop) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PLATFORM: ${{ matrix.platform }}
      DISPOSABL_DESKTOP_PLATFORM: ${{ matrix.platform }}
      CONVEX_SITE_URL: ${{ needs.web.outputs.convex_site_url }}
      electron_config_cache: ${{ github.workspace }}/.cache/electron
    steps:
      - *checkout
      - *node
      - *app-token
      - *bun
      - *cache
      - *install
      - name: Report desktop build
        run: node .github/scripts/disposabl.mjs report "$PLATFORM" building
      - name: Electron
        uses: actions/cache@v4
        with:
          path: .cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - name: Packages
        if: matrix.platform == 'linux'
        run: command -v fakeroot && command -v rpmbuild && command -v dpkg-deb || { sudo apt-get update && sudo apt-get install -y fakeroot dpkg rpm; }
      - name: Build
        run: bun run --cwd apps/desktop preview
      - *publish
      - name: Upload desktop release artifacts
        if: matrix.platform != 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.PLATFORM }}
          path: dist/release/
          retention-days: 3
          if-no-files-found: error
      - name: Upload unsigned macOS artifact
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned
          path: dist/release/*.dmg
          retention-days: 3
          if-no-files-found: error
      - name: Report macOS artifact
        if: matrix.platform == 'macos'
        run: |
          echo 'macOS DMG is ad-hoc signed, not Developer ID signed or notarized. Download it from this workflow run’s artifacts.' >> "$GITHUB_STEP_SUMMARY"
          node .github/scripts/disposabl.mjs report macos blocked 'Ad-hoc signed DMG available in workflow artifacts; Developer ID signing and notarization are not configured.'
      - name: Report desktop failure
        if: failure() || cancelled()
        run: node .github/scripts/disposabl.mjs report "$PLATFORM" failed
  packages:
    name: Package / ${{ matrix.package }}
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-${{ matrix.package }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        package: [cli, sdk]
    env:
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0, persist-credentials: false }
      - *node
      - *bun
      - *cache
      - *install
      - *app-token
      - name: Publish package if configured
        run: bash .github/scripts/release.sh package-release

  # The publisher executes scripts from main only; the authorizer verifies workflow_sha.
  publish:
    needs: [web, android, desktop]
    if: always() && !cancelled() && needs.web.result == 'success' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    environment: publishing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Disposabl installation token
        run: node .github/scripts/disposabl.mjs token
      - name: Select release source
        id: source
        run: bash .github/scripts/release.sh release-source
      - uses: actions/download-artifact@v4
        if: steps.source.outputs.current == 'true'
        with:
          pattern: release-*
          path: artifacts
      - name: Publish verified build artifacts
        if: steps.source.outputs.current == 'true'
        run: bash .github/scripts/release.sh release-publish
