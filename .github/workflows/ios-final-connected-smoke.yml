name: Final connected iOS preview smoke
on:
  push:
    branches: [benchmark/ios-final-connected-20261121]
permissions:
  actions: read
  contents: read
env:
  DO_NOT_TRACK: "1"
  EXPO_NO_TELEMETRY: "1"
  E2E_TELEMETRY_DISABLED: "1"
jobs:
  pins:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.pins.outputs.matrix }}
      test_sha: ${{ steps.pins.outputs.test_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: pins
        run: python3 .github/scripts/ios-final-pins.py >> "$GITHUB_OUTPUT"
  smoke:
    needs: pins
    if: github.repository == 'disposabl-dev/create-disposabl-app'
    name: Connected iOS ${{ matrix.label }}
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pins.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify exact pipeline job and artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ matrix.run }}
          ATTEMPT: ${{ matrix.attempt }}
          JOB: ${{ matrix.job }}
          ARTIFACT_ID: ${{ matrix.artifact }}
          EXPECTED_SHA: ${{ matrix.sha }}
          EXPECTED_DIGEST: ${{ matrix.digest }}
        run: bash .github/scripts/ios-final-origin.sh
      - name: Check out exact guest test source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.pins.outputs.test_sha }}
          path: product
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install test dependencies
        working-directory: product
        run: bun install --frozen-lockfile --filter @disposabl/tests
      - name: Download and validate exact simulator artifact
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ matrix.artifact }}
          ARTIFACT_DIGEST: ${{ matrix.digest }}
          EXPECTED_BUILD: ${{ matrix.build }}
        run: bash .github/scripts/ios-artifact-smoke.sh prepare
      - name: Create and boot dedicated simulator
        timeout-minutes: 5
        run: bash .github/scripts/ios-artifact-smoke.sh boot
      - name: Install and capture Discover
        timeout-minutes: 4
        env:
          EXPECTED_BUILD: ${{ matrix.build }}
        run: bash .github/scripts/ios-artifact-smoke.sh launch
      - name: Run guest iOS tests
        timeout-minutes: 8
        env:
          PRODUCT_SOURCE: ${{ needs.pins.outputs.test_sha }}
        run: bash .github/scripts/ios-artifact-smoke.sh test
      - name: Remove owned simulator
        if: always()
        timeout-minutes: 2
        run: bash .github/scripts/ios-artifact-smoke.sh cleanup
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: final-connected-ios-${{ matrix.label }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-smoke-evidence/
          if-no-files-found: warn
          retention-days: 3
