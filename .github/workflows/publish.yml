name: Publish npm package

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'disposabl-dev/create-disposabl-app'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - name: Set next patch version
        working-directory: cli
        run: npm version "0.0.$((GITHUB_RUN_NUMBER + 1))" --no-git-tag-version
      - run: bun run build
      - name: Pack npm artifact
        id: pack
        working-directory: cli
        run: |
          tarball=$(npm pack --ignore-scripts --silent)
          echo "tarball=$PWD/$tarball" >> "$GITHUB_OUTPUT"
      - name: Test packed CLI and generated app
        run: bun cli/smoke.ts "$TARBALL"
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
      - name: Publish tested artifact
        run: npm publish "$TARBALL" --access public
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
