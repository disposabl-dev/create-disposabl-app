name: Publish npm package

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'disposabl-dev/create-disposabl-app'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/create-disposabl-app
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Prepare semver release
        id: release
        run: bun release.ts prepare
      - run: bun fmt --check
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - name: Pack npm artifact
        id: pack
        run: |
          tarball=$(npm pack --ignore-scripts --silent)
          echo "tarball=$PWD/$tarball" >> "$GITHUB_OUTPUT"
      - name: Publish npm package and GitHub Release
        if: steps.release.outputs.version != ''
        run: bun release.ts publish "$TARBALL"
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          GH_TOKEN: ${{ github.token }}
