name: Publish npm package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'disposabl-dev/create-disposabl-app' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/create-disposabl-app
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun fmt --check
      - run: bun run typecheck
      - run: bun run lint
      # semantic-release sets the package version, builds, tags this commit, and publishes.
      # Recovery after a publish failure: check npm and GitHub for the tagged version first.
      # A tagged version is skipped on rerun; restore missing artifacts from that exact commit/version.
      - run: bun run semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Bun owns dependency installation; npm only versions and publishes this package.
          npm_config_workspaces_update: "false"

  packages:
    name: Package / ${{ matrix.package }}
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: npm-${{ matrix.package }}
      cancel-in-progress: false
      queue: max
    strategy:
      fail-fast: false
      matrix:
        package: [cli, sdk]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Selected package
        id: selected
        run: echo "exists=$(test -f packages/${{ matrix.package }}/package.json && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v6
        if: steps.selected.outputs.exists == 'true'
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        if: steps.selected.outputs.exists == 'true'
        with:
          bun-version: "1.4.4"
      - name: Install and generate
        if: steps.selected.outputs.exists == 'true'
        run: |
          bun install --frozen-lockfile
          bun run generate
      - name: Validate package
        if: steps.selected.outputs.exists == 'true'
        run: bun run --cwd packages/${{ matrix.package }} typecheck
      - name: Publish
        if: steps.selected.outputs.exists == 'true'
        working-directory: packages/${{ matrix.package }}
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          npm_config_workspaces_update: "false"
