name: Set up Bun lint
description: Use a pinned Bun linter when available, otherwise retain ESLint
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        prefix="$RUNNER_TEMP/disposabl-bun-lint"
        tool=$(node -p '["@oven/bun", process.platform === "win32" ? "windows" : process.platform, process.arch === "arm64" ? "aarch64" : process.arch].join("-")')
        linter="$prefix/node_modules/$tool/bin/bun"
        if [[ "${RUNNER_OS:-}" == Windows ]]; then linter="$linter.exe"; fi
        if npm install --prefix "$prefix" --no-save --no-audit --no-fund --ignore-scripts "$tool@1.4.5-canary.20261120.1+7bb427f"; then
          if [[ "$("$linter" --revision)" == '1.4.6-canary.1+7bb427f3b' ]]; then
            printf 'DISPOSABL_BUN_LINT=%s\n' "$linter" >> "$GITHUB_ENV"
          else
            echo 'Bun linter revision mismatch; using ESLint.'
          fi
        else
          echo 'Bun linter unavailable; using ESLint.'
        fi
