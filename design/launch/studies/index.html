        <iframe
          id="preview"
          title="Selected landing page concept"
          src="versions/001.html"
        ></iframe>
      </div>
    </main>
    <script>
      const pick = document.querySelector("#pick"),
        frame = document.querySelector("#frame"),
        preview = document.querySelector("#preview");
      function show() {
        preview.src = pick.value;
      }
      pick.addEventListener("change", show);
      document
        .querySelector("#size")
        .addEventListener(
          "change",
          (e) => (frame.className = "frame " + e.target.value),
        );
      document.querySelector("#prev").onclick = () => {
        pick.selectedIndex = Math.max(0, pick.selectedIndex - 1);
        show();
      };
      document.querySelector("#next").onclick = () => {
        pick.selectedIndex = Math.min(
          pick.options.length - 1,
          pick.selectedIndex + 1,
        );
        show();
      };
    </script>
